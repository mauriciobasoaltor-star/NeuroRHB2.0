    // -------------------------------------------------------------------------
    // ACTIVE TRAINING VIEWPORT (DISPATCHES TO THE 5 ENGINES)
    // -------------------------------------------------------------------------
    function renderActiveExerciseView() {
      const cfg = uiState.activeExerciseConfig;
      const eng = uiState.engine;
      if (!cfg || !eng) return '';

      let bodyHtml = '';
      if (cfg.domain === 'inhibitory') bodyHtml = renderEngineGoNoGo(cfg, eng);
      else if (cfg.domain === 'memory') bodyHtml = renderEngineMemory(cfg, eng);
      else if (cfg.domain === 'adl') bodyHtml = renderEngineAdl(cfg, eng);
      else if (cfg.domain === 'language') bodyHtml = renderEngineLanguage(cfg, eng);
      else if (cfg.domain === 'motor') bodyHtml = renderEngineMotor(cfg, eng);

      return `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.75rem;gap:0.5rem;">
          <button type="button" class="btn btn-outline btn-sm" onclick="switchUserTab('plan')">← Volver a Mi Plan</button>
          <span class="badge badge-petrol">${DOMAIN_META[cfg.domain]?.name || ''}</span>
        </div>
        ${bodyHtml}
      `;
    }

    // --- ENGINE 1 VIEW: GO / NO-GO ADAPTIVE ---
    function renderEngineGoNoGo(cfg, eng) {
      let h = renderEngineGoNoGo0(cfg, eng);
      if (eng.phase === 'summary') {
        const i = h.lastIndexOf('</section>');
        if (i >= 0) h = h.slice(0, i) + hemiSummaryHTML(eng) + h.slice(i);
      } else if (eng.phase === 'intro' && hemiModeNow() !== 'center') {
        h = h.replace('<button type="button" class="btn btn-sage btn-block" onclick="startGoNoGoSession()">',
          '<p style="font-size:.88rem;font-weight:700;color:var(--petrol)">👁 Mantén la mirada en la cruz (+) del centro: las señales pueden aparecer a la izquierda o a la derecha.</p><button type="button" class="btn btn-sage btn-block" onclick="startGoNoGoSession()">');
      }
      return h;
    }

    function renderEngineGoNoGo0(cfg, eng) {
      if (eng.phase === 'intro') {
        return `
          <section class="card card-highlight-petrol">
            <span class="eyebrow">Control Inhibitorio · Paradigma Go / No-Go</span>
            <h2 class="section-title">${cfg.title}</h2>
            <p style="font-size:0.92rem;color:var(--text-secondary);">
              Este ejercicio adapta automáticamente su velocidad según tus aciertos:
            </p>
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));gap:0.75rem;margin:0.9rem 0;">
              <div style="background:var(--sage-soft);border:1.5px solid var(--sage);border-radius:12px;padding:0.85rem;text-align:center;">
                <div style="transform:scale(0.65);height:64px;display:flex;align-items:center;justify-content:center;">${SVG_LIBRARY.signal_go}</div>
                <strong style="color:var(--sage-dark);display:block;">Señal Verde (GO)</strong>
                <span style="font-size:0.82rem;">Pulsa el botón verde lo más rápido posible.</span>
              </div>
              <div style="background:var(--coral-soft);border:1.5px solid var(--coral);border-radius:12px;padding:0.85rem;text-align:center;">
                <div style="transform:scale(0.65);height:64px;display:flex;align-items:center;justify-content:center;">${SVG_LIBRARY.signal_nogo}</div>
                <strong style="color:var(--coral-dark);display:block;">Señal Roja (NO-GO)</strong>
                <span style="font-size:0.82rem;">¡Frena! No pulses nada y espera a que desaparezca.</span>
              </div>
              ${eng.dualTask ? `
                <div style="background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:12px;padding:0.85rem;text-align:center;">
                  <div style="height:64px;display:flex;align-items:center;justify-content:center;">${SVG_LIBRARY.obj_farmacos}</div>
                  <strong style="color:var(--amber-dark);display:block;">Tarea Dual Prospectiva</strong>
                  <span style="font-size:0.82rem;">Si aparece el Medicamento, pulsa «Recordatorio».</span>
                </div>
              ` : ''}
            </div>
            <button type="button" class="btn btn-sage btn-block" onclick="startGoNoGoSession()">▶ Comenzar Entrenamiento (${eng.totalTrials} ensayos)</button>
          </section>
        `;
      }

      if (eng.phase === 'running') {
        return `
          <section class="card card-highlight-petrol">
            <div id="gonogoHud" style="display:flex;flex-wrap:wrap;gap:0.4rem;justify-content:space-between;margin-bottom:0.5rem;"></div>
            <div class="gonogo-arena">
              <div id="gonogoStage" class="gonogo-stage"></div>
              <div class="gonogo-pad-row ${eng.dualTask ? 'with-dual' : ''}">
                <button type="button" class="btn-tap-go" onclick="handleGoNoGoTap('go')">
                  ✓ RESPONDER (SEÑAL VERDE)
                </button>
                ${eng.dualTask ? `
                  <button type="button" class="btn-tap-prospective" onclick="handleGoNoGoTap('prospective')">
                    💊 RECORDATORIO MEDICAMENTO
                  </button>
                ` : ''}
              </div>
            </div>
          </section>
        `;
      }

      // Summary phase
      const s = eng.stats;
      const meanRt = s.reactionTimes.length > 0 ? Math.round(s.reactionTimes.reduce((a, b) => a + b, 0) / s.reactionTimes.length) : 0;
      const goAcc = s.goTotal > 0 ? Math.round((s.goHits / s.goTotal) * 100) : 100;
      const nogoAcc = s.nogoTotal > 0 ? Math.round((s.nogoInhibited / s.nogoTotal) * 100) : 100;

      return `
        <section class="card card-highlight-sage">
          <span class="badge badge-sage">✓ Entrenamiento Finalizado</span>
          <h2 class="section-title" style="margin-top:0.35rem;">Resultados de Control Inhibitorio</h2>
          <div class="kpi-grid" style="margin-top:0.9rem;">
            <div class="kpi-box">
              <div class="kpi-label">Tiempo Reacción Medio</div>
              <div class="kpi-val">${meanRt} ms</div>
              <div class="kpi-sub">Velocidad de procesamiento</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">Aciertos Go</div>
              <div class="kpi-val">${goAcc}%</div>
              <div class="kpi-sub">${s.goHits} de ${s.goTotal} señales verdes</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">Inhibición No-Go</div>
              <div class="kpi-val">${nogoAcc}%</div>
              <div class="kpi-sub">${s.nogoInhibited} de ${s.nogoTotal} frenadas</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">Ventana Adaptativa Final</div>
              <div class="kpi-val">${eng.currentWindowMs} ms</div>
              <div class="kpi-sub">Mínima alcanzada: ${eng.minWindowReached} ms</div>
            </div>
          </div>
          <button type="button" class="btn btn-sage btn-block" onclick="finishAndSaveActiveExercise()">
            ✓ Guardar Resultados y Continuar
          </button>
        </section>
      `;
    }

    // --- ENGINE 2 VIEW: EPISODIC & PROSPECTIVE MEMORY ---
    function renderEngineMemory(cfg, eng) {
      if (eng.phase === 'encoding') {
        const allConsolidated = eng.consolidatedIds.length >= eng.targetItems.length;
        return `
          <section class="card card-highlight-petrol">
            <span class="badge badge-petrol">Fase 1 de 3 · Codificación Activa</span>
            <h2 class="section-title" style="margin-top:0.35rem;">${eng.scenario.title}</h2>
            <p style="font-size:0.9rem;color:var(--text-secondary);">${eng.scenario.contextIntro}</p>
            <div style="background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:12px;padding:0.75rem 0.9rem;margin-bottom:0.9rem;font-size:0.86rem;font-weight:700;color:var(--amber-dark);">
              📌 ${eng.scenario.prospectiveCue}
            </div>
            <p style="font-size:0.84rem;font-weight:700;color:var(--petrol);">
              Toca cada tarjeta para consolidarla (${eng.consolidatedIds.length}/${eng.targetItems.length}):
            </p>
            <div class="mem-cards-grid">
              ${eng.targetItems.map(item => {
                const isDone = eng.consolidatedIds.includes(item.id);
                return `
                  <div class="mem-item-card ${isDone ? 'consolidated' : ''}" onclick="toggleMemoryConsolidation('${item.id}')">
                    ${SVG_LIBRARY[item.id] || SVG_LIBRARY.obj_agenda}
                    <strong style="font-size:0.92rem;color:var(--petrol-dark);">${item.label}</strong>
                    <span style="font-size:0.76rem;color:var(--text-secondary);">${item.detail}</span>
                    <span class="badge ${isDone ? 'badge-sage' : 'badge-petrol'}">${isDone ? '✓ Memorizado' : 'Tocar'}</span>
                  </div>
                `;
              }).join('')}
            </div>
            <div style="margin-top:1rem;">
              <button type="button" class="btn btn-petrol btn-block" ${!allConsolidated ? 'disabled' : ''} onclick="startMemoryInterference()">
                Continuar a Fase 2 (Retención) →
              </button>
            </div>
          </section>
        `;
      }

      if (eng.phase === 'interference') {
        return `
          <section class="card card-highlight-petrol" style="text-align:center;">
            <span class="badge badge-amber">Fase 2 de 3 · Tarea Atencional Breve (<span id="memInterfTimer">${eng.interfererSecLeft}s</span>)</span>
            <h2 class="section-title" style="margin-top:0.4rem;">Pulsa los números en orden del 1 al 8</h2>
            <p style="font-size:0.88rem;color:var(--text-secondary);">Mantén tu atención activa mientras consolidamos tu memoria.</p>
            <div class="interference-grid">
              ${eng.interfererNumbers.map(n => `
                <button type="button" class="num-tile-btn ${n < eng.interfererNextNum ? 'done' : ''}"
                  onclick="handleInterferenceNumTap(${n})">${n}</button>
              `).join('')}
            </div>
          </section>
        `;
      }

      return `
        <section class="card card-highlight-sage">
          <span class="badge badge-sage">Fase 3 de 3 · Evocación y Memoria Prospectiva</span>
          <h2 class="section-title" style="margin-top:0.35rem;">Selecciona los ${eng.targetItems.length} elementos que memorizaste</h2>
          <p style="font-size:0.86rem;color:var(--text-secondary);">
            Seleccionados: <b>${eng.selectedIds.length}</b> de ${eng.targetItems.length}
          </p>
          <div class="mem-cards-grid" style="margin-bottom:1rem;">
            ${eng.recognitionPool.map(item => {
              const isSel = eng.selectedIds.includes(item.id);
              return `
                <div class="mem-item-card ${isSel ? 'selected' : ''}" onclick="toggleMemoryRecallSelection('${item.id}')">
                  ${SVG_LIBRARY[item.id] || SVG_LIBRARY.obj_agenda}
                  <strong style="font-size:0.9rem;color:var(--petrol-dark);">${item.label}</strong>
                  <span class="badge ${isSel ? 'badge-sage' : 'badge-petrol'}">${isSel ? '✓ Elegido' : 'Seleccionar'}</span>
                </div>
              `;
            }).join('')}
          </div>

          <div style="background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:12px;padding:0.85rem;margin-bottom:1rem;">
            <div style="font-size:0.84rem;font-weight:700;color:var(--amber-dark);margin-bottom:0.5rem;">
              ¿Recuerdas la consigna especial del inicio?
            </div>
            <button type="button" class="btn ${eng.prospectiveConfirmed ? 'btn-sage' : 'btn-amber'} btn-block"
              onclick="uiState.engine.prospectiveConfirmed=!uiState.engine.prospectiveConfirmed;renderApp()">
              ${eng.prospectiveConfirmed ? '✓ Consigna Prospectiva Confirmada' : eng.scenario.prospectiveActionLabel}
            </button>
          </div>

          <button type="button" class="btn btn-petrol btn-block" onclick="finishAndSaveActiveExercise()">
            ✓ Finalizar y Guardar Resultado
          </button>
        </section>
      `;
    }

    // --- ENGINE 3 VIEW: ADL / IADL SEQUENCING ---
    function renderEngineAdl(cfg, eng) {
      if (eng.phase === 'sequencing') {
        return `
          <section class="card card-highlight-petrol">
            <span class="badge badge-amber">${eng.scenario.category}</span>
            <h2 class="section-title" style="margin-top:0.35rem;">${eng.scenario.title}</h2>
            <p style="font-size:0.88rem;color:var(--text-secondary);">
              Toca las acciones de abajo en el orden lógico correcto para ubicarlas en los pasos numerados (toca un paso lleno si deseas quitarlo):
            </p>

            ${eng.scaffoldingHint ? `
              <div style="background:var(--amber-soft);border:1.5px solid var(--amber);border-radius:12px;padding:0.8rem;margin-bottom:0.85rem;font-size:0.86rem;font-weight:700;color:var(--amber-dark);">
                💡 ${eng.scaffoldingHint}
              </div>
            ` : ''}

            <div class="adl-slots-list">
              ${eng.slots.map((slotItem, idx) => `
                <div class="adl-slot ${slotItem ? 'filled' : ''}" onclick="removeAdlStepFromSlot(${idx})">
                  <div style="display:flex;align-items:center;gap:0.65rem;">
                    <span class="adl-step-num">${idx + 1}</span>
                    <span style="font-size:0.9rem;font-weight:${slotItem ? '700' : '500'};color:${slotItem ? 'var(--text-main)' : 'var(--text-muted)'};">
                      ${slotItem ? slotItem.text : `Toca abajo la acción para el Paso ${idx + 1}`}
                    </span>
                  </div>
                  ${slotItem ? `<span class="badge badge-coral">Quitar</span>` : ''}
                </div>
              `).join('')}
            </div>

            ${eng.pool.length > 0 ? `
              <div style="margin-bottom:0.9rem;">
                <strong style="font-size:0.82rem;color:var(--petrol);display:block;margin-bottom:0.45rem;">Acciones Disponibles (Toca para colocar):</strong>
                <div class="adl-pool-grid">
                  ${eng.pool.map(p => `
                    <button type="button" class="adl-choice-btn" onclick="placeAdlStepInNextSlot('${p.id}')">
                      <div style="transform:scale(0.62);width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                        ${SVG_LIBRARY[p.icon] || SVG_LIBRARY.obj_agenda}
                      </div>
                      <span>${p.text}</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <button type="button" class="btn btn-sage btn-block" ${eng.slots.some(s => s === null) ? 'disabled' : ''} onclick="verifyAdlSequence()">
              ✓ Verificar Secuencia Planificada
            </button>
          </section>
        `;
      }

      // Unexpected Executive Event Phase
      const ev = eng.scenario.unexpectedEvent;
      return `
        <section class="card card-highlight-sage">
          <span class="badge badge-sage">✓ Secuencia Inicial Lograda</span>
          <h2 class="section-title" style="margin-top:0.35rem;">Resolución de Imprevisto Ejecutivo</h2>
          <div style="background:var(--amber-soft);border:2px solid var(--amber);border-radius:14px;padding:0.95rem;margin:0.85rem 0;font-weight:700;color:var(--amber-dark);">
            ${ev.prompt}
          </div>

          <div style="display:flex;flex-direction:column;gap:0.6rem;margin-bottom:1rem;">
            ${ev.options.map((opt, idx) => {
              const isChosen = eng.unexpectedChoiceIdx === idx;
              let borderStyle = 'var(--border-strong)';
              let bgStyle = '#FFFFFF';
              if (isChosen) {
                borderStyle = opt.correct ? 'var(--sage)' : 'var(--coral)';
                bgStyle = opt.correct ? 'var(--sage-soft)' : 'var(--coral-soft)';
              }
              return `
                <button type="button" style="text-align:left;padding:0.85rem;border-radius:12px;border:2px solid ${borderStyle};background:${bgStyle};font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;"
                  onclick="answerAdlUnexpected(${idx})">
                  ${opt.text}
                  ${isChosen ? `<div style="margin-top:0.4rem;font-size:0.82rem;font-weight:600;color:${opt.correct ? 'var(--sage-dark)' : 'var(--coral-dark)'};">${opt.feedback}</div>` : ''}
                </button>
              `;
            }).join('')}
          </div>

          ${eng.unexpectedSolved ? `
            <button type="button" class="btn btn-petrol btn-block" onclick="finishAndSaveActiveExercise()">
              ✓ Completar Actividad y Guardar
            </button>
          ` : ''}
        </section>
      `;
    }

    // --- ENGINE 4 VIEW: LANGUAGE (4-LEVEL CUES, SFA, PRAGMATICS) ---
    function renderEngineLanguage(cfg, eng) {
      const subSwitcher = `
        <div style="display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:0.85rem;">
          <button type="button" class="btn btn-sm ${eng.subMode === 'naming' ? 'btn-petrol' : 'btn-outline'}"
            onclick="uiState.engine.subMode='naming';uiState.engine.completed=false;renderApp()">1. Denominación con Claves</button>
          <button type="button" class="btn btn-sm ${eng.subMode === 'sfa' ? 'btn-petrol' : 'btn-outline'}"
            onclick="uiState.engine.subMode='sfa';uiState.engine.completed=false;renderApp()">2. Rasgos Semánticos (ARS)</button>
          <button type="button" class="btn btn-sm ${eng.subMode === 'pragmatic' ? 'btn-petrol' : 'btn-outline'}"
            onclick="uiState.engine.subMode='pragmatic';uiState.engine.completed=false;renderApp()">3. Pragmática y Refranes</button>
        </div>
      `;

      if (eng.completed) {
        return `
          <section class="card card-highlight-sage">
            ${subSwitcher}
            <span class="badge badge-sage">✓ Módulo de Lenguaje Completado</span>
            <h2 class="section-title" style="margin-top:0.35rem;">¡Excelente práctica comunicativa!</h2>
            <p style="font-size:0.9rem;color:var(--text-secondary);">Todos los estímulos y claves han sido registrados correctamente.</p>
            <button type="button" class="btn btn-sage btn-block" onclick="finishAndSaveActiveExercise()">
              ✓ Guardar Resultados en Evolución
            </button>
          </section>
        `;
      }

      const item = eng.items[eng.itemIndex];

      if (eng.subMode === 'naming') {
        return `
          <section class="card card-highlight-petrol">
            ${subSwitcher}
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="badge badge-petrol">Estímulo ${eng.itemIndex + 1} de ${eng.items.length}</span>
              <span class="badge badge-amber">Nivel Clave: ${eng.cueLevel} / 4</span>
            </div>

            <div style="text-align:center;padding:1.1rem;background:var(--bg-app);border-radius:16px;margin:0.85rem 0;">
              <div style="transform:scale(1.35);height:84px;display:flex;align-items:center;justify-content:center;">
                ${SVG_LIBRARY[item.icon]}
              </div>
              <div style="font-size:1.15rem;font-weight:800;color:var(--petrol-dark);margin-top:0.5rem;">
                ${eng.cueLevel === 4 ? item.word : '¿Cómo se llama este objeto?'}
              </div>
              ${eng.cueLevel === 4 ? `
                <button type="button" class="btn btn-outline btn-sm" style="margin-top:0.45rem;" onclick="speakSpanish('${item.word.toLowerCase()}')">
                  🔊 Escuchar Pronunciación
                </button>
              ` : ''}
            </div>

            <!-- Progressive Cue Hierarchy -->
            ${eng.cueLevel >= 1 ? `<div class="cue-step-card"><b>1. Clave Semántica:</b> ${item.semanticCue}</div>` : ''}
            ${eng.cueLevel >= 2 ? `<div class="cue-step-card" style="border-left-color:var(--sage);"><b>2. Cierre de Oración:</b> ${item.clozeCue}</div>` : ''}
            ${eng.cueLevel >= 3 ? `<div class="cue-step-card" style="border-left-color:var(--amber);"><b>3. Clave Fonológica:</b> ${item.phonemicCue} <button type="button" class="btn btn-outline btn-sm" style="margin-left:6px;min-height:30px;" onclick="speakSpanish('${item.phonemicCue.replace(/\/|\.\.\./g, '')}')">🔊 Oír</button></div>` : ''}

            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin:0.85rem 0;">
              <button type="button" class="btn btn-amber" style="flex:1;" ${eng.cueLevel >= 4 ? 'disabled' : ''} onclick="revealNextLanguageCue()">
                💡 Solicitar Siguiente Clave (${Math.min(4, eng.cueLevel + 1)}/4)
              </button>
            </div>

            <div style="border-top:1px solid var(--border-light);padding-top:0.85rem;">
              <span style="font-size:0.8rem;font-weight:700;color:var(--text-secondary);display:block;margin-bottom:0.45rem;">Registrar Respuesta Lograda:</span>
              <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:0.5rem;">
                <button type="button" class="btn btn-sage btn-sm" onclick="recordNamingResult(3)">✓ Autónoma (3 pts)</button>
                <button type="button" class="btn btn-petrol btn-sm" onclick="recordNamingResult(2)">Con Clave Semántica (2 pts)</button>
                <button type="button" class="btn btn-outline btn-sm" onclick="recordNamingResult(1)">Con Clave Fonológica (1 pt)</button>
              </div>
            </div>
          </section>
        `;
      }

      if (eng.subMode === 'sfa') {
        const sfaLabels = [
          { key: 'categoria', title: '1. Categoría' },
          { key: 'uso', title: '2. Uso / Función' },
          { key: 'caracteristicas', title: '3. Características' },
          { key: 'ubicacion', title: '4. Ubicación' },
          { key: 'asociacion', title: '5. Asociación' },
          { key: 'accion', title: '6. Acción' }
        ];
        return `
          <section class="card card-highlight-petrol">
            ${subSwitcher}
            <h2 class="section-title">Análisis de Rasgos Semánticos (ARS)</h2>
            <p style="font-size:0.86rem;color:var(--text-secondary);">Toca cada atributo alrededor del concepto central para activarlo y comentarlo:</p>

            <div style="text-align:center;padding:0.85rem;background:var(--petrol-soft);border-radius:14px;margin-bottom:0.85rem;">
              ${SVG_LIBRARY[item.icon]}
              <div style="font-size:1.15rem;font-weight:800;color:var(--petrol-dark);">${item.word}</div>
            </div>

            <div class="sfa-grid" style="margin-bottom:1rem;">
              ${sfaLabels.map(node => {
                const isExp = eng.exploredSfaKeys.includes(node.key);
                return `
                  <div class="sfa-node ${isExp ? 'explored' : ''}" onclick="toggleSfaNode('${node.key}')">
                    <div style="font-size:0.78rem;font-weight:800;color:var(--petrol);">${node.title}</div>
                    <div style="font-size:0.88rem;font-weight:600;margin-top:0.2rem;">
                      ${isExp ? item.sfa[node.key] : 'Tocar para revelar rasgo'}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <button type="button" class="btn btn-sage btn-block" onclick="uiState.engine.completed=true;renderApp()">
              ✓ Completar Mapa Semántico
            </button>
          </section>
        `;
      }

      // Pragmatic & Figurative Language
      const pItem = PRAGMATIC_ITEMS[eng.pragmaticIndex];
      return `
        <section class="card card-highlight-petrol">
          ${subSwitcher}
          <span class="badge badge-petrol">Situación ${eng.pragmaticIndex + 1} de ${PRAGMATIC_ITEMS.length}</span>
          <h2 class="section-title" style="margin-top:0.35rem;">Comprensión Pragmática y Lenguaje Figurado</h2>
          <div style="background:var(--bg-app);border-radius:12px;padding:0.9rem;margin:0.75rem 0;font-weight:700;">
            ${pItem.prompt}
          </div>
          <div style="display:flex;flex-direction:column;gap:0.55rem;margin-bottom:0.9rem;">
            ${pItem.options.map((opt, idx) => {
              const isSel = eng.pragmaticSelected === idx;
              let border = 'var(--border-strong)';
              let bg = '#FFFFFF';
              if (eng.pragmaticSelected !== null) {
                if (opt.correct) { border = 'var(--sage)'; bg = 'var(--sage-soft)'; }
                else if (isSel) { border = 'var(--coral)'; bg = 'var(--coral-soft)'; }
              }
              return `
                <button type="button" style="text-align:left;padding:0.8rem;border-radius:12px;border:2px solid ${border};background:${bg};font-family:inherit;font-size:0.88rem;font-weight:700;cursor:pointer;"
                  onclick="selectPragmaticOption(${idx})">
                  ${opt.text}
                  ${(isSel || (eng.pragmaticSelected !== null && opt.correct)) ? `<div style="margin-top:0.35rem;font-size:0.8rem;font-weight:600;">${opt.explanation}</div>` : ''}
                </button>
              `;
            }).join('')}
          </div>
          ${eng.pragmaticSelected !== null ? `
            <button type="button" class="btn btn-petrol btn-block" onclick="nextPragmaticItem()">
              ${eng.pragmaticIndex + 1 < PRAGMATIC_ITEMS.length ? 'Siguiente Situación →' : 'Finalizar Módulo'}
            </button>
          ` : ''}
        </section>
      `;
    }

    // --- ENGINE 5 VIEW: UPPER EXTREMITY MOTOR WORKSTATION ---
    function renderEngineMotor(cfg, eng) {
      return renderEngineMotor0(cfg, eng) + `<section class="card" style="margin-top:.8rem">
        <button type="button" class="btn btn-block" onclick="camOpen()">📷 Asistente de cámara: conteo y compensación de tronco</button>
        <small style="color:var(--text-muted)">Requiere marcadores de color en la muñeca (y tronco). El video se procesa en tu dispositivo y no se guarda ni se envía.</small></section>`;
    }

    function renderEngineMotor0(cfg, eng) {
      const ex = MOTOR_EXERCISES.find(m => m.id === eng.selectedMotorId) || MOTOR_EXERCISES[0];
      const total = eng.effectiveReps + eng.compensatedReps;
      const qualPct = total > 0 ? Math.round((eng.effectiveReps / total) * 100) : 100;
      const meets80 = qualPct >= 80;
      const clockVal = eng.timerMode === 'stopwatch' ? eng.elapsedSec : eng.remainingSec;

      return `
        <section class="card card-highlight-petrol">
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.65rem;">
            <span class="badge badge-petrol">Nivel ${ex.level} · Actividad ${ex.code}</span>
            <select class="select-ctrl" style="max-width:300px;min-height:38px;font-size:0.82rem;"
              onchange="selectMotorExerciseInEngine(this.value)">
              ${MOTOR_EXERCISES.map(m => `
                <option value="${m.id}" ${m.id === ex.id ? 'selected' : ''}>[${m.level}] ${m.code} ${m.title}</option>
              `).join('')}
            </select>
          </div>

          <h2 class="section-title">${ex.title}</h2>
          <div style="background:var(--bg-app);border:1px solid var(--border-light);border-radius:12px;padding:0.8rem;margin:0.65rem 0;display:flex;flex-wrap:wrap;align-items:center;gap:0.85rem;">
            <div style="background:#FFFFFF;border:1.5px solid var(--border-light);border-radius:12px;padding:0.4rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 auto;">
              ${SVG_LIBRARY[ex.svg] || SVG_LIBRARY.domain_motor}
            </div>
            <div style="flex:1;min-width:210px;font-size:0.85rem;">
              <div><b>Objetivo:</b> ${ex.objective}</div>
              <div style="margin-top:0.35rem;color:var(--amber-dark);"><b>Control Clínico:</b> ${ex.control}</div>
            </div>
          </div>

          <!-- Block Timer + 3s Rhythmic Guide -->
          <div style="background:${eng.timerMode === 'rest' ? 'var(--amber-soft)' : 'var(--bg-app)'};border:1.5px solid var(--border-light);border-radius:14px;padding:0.9rem;margin-bottom:0.85rem;">
            <div style="display:flex;flex-wrap:wrap;gap:0.35rem;margin-bottom:0.65rem;">
              ${[
                { l: '30s', s: 30 }, { l: '60s', s: 60 }, { l: '90s', s: 90 },
                { l: '3 min', s: 180 }, { l: '5 min', s: 300 }, { l: 'Libre', s: 0 }
              ].map(p => `
                <button type="button" class="btn btn-sm ${eng.timerMode !== 'rest' && eng.presetSec === p.s ? 'btn-petrol' : 'btn-outline'}"
                  style="min-height:34px;" onclick="setMotorTimerPreset(${p.s})">${p.l}</button>
              `).join('')}
              <button type="button" class="btn btn-sm btn-amber" style="min-height:34px;" onclick="startMotorRest60()">☕ Descanso 60s</button>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.75rem;">
              <div class="motor-timer-digits" id="motorClockDigits">${formatSecMMSS(clockVal)}</div>
              <div style="display:flex;gap:0.5rem;">
                <button type="button" class="btn ${eng.running ? 'btn-amber' : 'btn-petrol'}" onclick="toggleMotorTimer()">
                  ${eng.running ? '⏸ Pausar' : '▶ Iniciar'}
                </button>
                <button type="button" class="btn btn-outline" onclick="setMotorTimerPreset(eng.presetSec)">↺</button>
              </div>
            </div>

            <!-- 3s Rhythmic Pulse -->
            <div style="margin-top:0.75rem;padding-top:0.65rem;border-top:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between;gap:0.5rem;">
              <div style="display:flex;align-items:center;gap:0.55rem;">
                <div class="rhythm-orb" id="motorRhythmOrb"></div>
                <span style="font-size:0.82rem;font-weight:700;">Guía Rítmica Lenta (3s · Terapia en Espejo)</span>
              </div>
              <button type="button" class="btn btn-sm ${eng.rhythmActive ? 'btn-sage' : 'btn-outline'}" onclick="toggleMotorRhythm3s()">
                ${eng.rhythmActive ? 'Detener' : 'Activar 3s'}
              </button>
            </div>
          </div>

          <!-- Tactile Repetition Counters -->
          <div style="display:flex;gap:0.5rem;margin-bottom:0.65rem;">
            <button type="button" class="btn-motor-eff" onclick="adjustMotorReps('eff', 1)">
              <span style="font-size:0.82rem;font-weight:800;text-transform:uppercase;">+1 Repetición Efectiva</span>
              <span style="font-size:2.4rem;font-weight:800;line-height:1.05;">${eng.effectiveReps}</span>
              <span style="font-size:0.75rem;opacity:0.9;">Ejecución limpia (o Barra Espaciadora)</span>
            </button>
            <button type="button" class="btn btn-outline" style="min-width:54px;" onclick="adjustMotorReps('eff', -1)">-1</button>
          </div>

          <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;">
            <button type="button" class="btn-motor-comp" onclick="adjustMotorReps('comp', 1)">
              <span>+1 Con Compensación (Tronco / Hombro)</span>
              <span style="font-size:1.5rem;">${eng.compensatedReps}</span>
            </button>
            <button type="button" class="btn btn-outline" style="min-width:54px;" onclick="adjustMotorReps('comp', -1)">-1</button>
          </div>

          <!-- Rule of 80% Quality Indicator -->

    // -------------------------------------------------------------------------
    // CLINICAL MODE VIEW 3: EVOLUCIÓN E INFORME CLÍNICO OBJETIVO
    // -------------------------------------------------------------------------
        // =========================================================================
    // EVALUACIÓN BASAL Y REEVALUACIONES (sesiones 10 / 20 / 30), ADAPTACIONES Y SEGURIDAD
    // Sesión = día con al menos una actividad registrada. Cada hito compara
    // ventanas de 3 sesiones (basal: 1-3; hito 10: 8-10; 20: 18-20; 30: 28-30).
    // =========================================================================
    const SESSION_T0 = Date.now();
    // ref = diferencia de referencia aproximada (editable); verificar en literatura
    const EV_SCALES = [
      { k: 'moca', n: 'MoCA', max: 30, ref: 2 },
      { k: 'barthel', n: 'Barthel', max: 100, ref: 10 },
      { k: 'fm', n: 'Fugl-Meyer EESS', max: 66, ref: 5 },
      { k: 'arat', n: 'ARAT', max: 57, ref: 6 },
      { k: 'naming', n: 'Denominación (%)', max: 100, ref: 10 }
    ];
    const EV_MS = [
      { k: 'basal', n: 'Basal', s: 3 }, { k: 'm10', n: 'Ses. 10', s: 10 },
      { k: 'm20', n: 'Ses. 20', s: 20 }, { k: 'm30', n: 'Ses. 30', s: 30 }
    ];
    const EV_DOM = {
      inhibitory: ['nogoAccPct', 'Inhibición No-Go'], memory: ['recallPct', 'Recuerdo episódico'],
      adl: ['adlAutonomyPct', 'Autonomía AVD'], language: ['namingScorePct', 'Lenguaje'],
      motor: ['motorQualityPct', 'Calidad motora']
    };
    const DIFF_W = { 'Básico': 0.8, 'Severo': 0.8, 'Intermedio': 1, 'Moderado': 1, 'Avanzado': 1.2 };

    function evData(pid) {
      const h = appState.sessionHistory.filter(x => x.patientId === pid);
      return { h, days: [...new Set(h.map(x => x.date))].sort() };
    }
    function evWindow(d, s) {
      if (d.days.length < s) return null;
      const set = new Set(d.days.slice(s - 3, s));
      return d.h.filter(x => set.has(x.date));
    }
    // % bruto y índice ponderado por dificultad (nivel Avanzado pesa más que Básico)
    function evDomainStats(entries) {
      const out = {};
      Object.keys(EV_DOM).forEach(dm => {
        const arr = entries.filter(e => e.domain === dm && e.metrics && e.metrics[EV_DOM[dm][0]] != null);
        if (!arr.length) { out[dm] = null; return; }
        const raw = arr.reduce((a, e) => a + e.metrics[EV_DOM[dm][0]], 0) / arr.length;
        const w = arr.reduce((a, e) => a + (DIFF_W[e.difficulty] || 1), 0) / arr.length;
        out[dm] = { raw: Math.round(raw), idx: Math.round(raw * w) };
      });
      return out;
    }
    function evDelta(a, b, ref) {
      if (a == null || b == null) return '—';
      const d = b - a, big = Math.abs(d) >= ref;
      const c = big ? (d > 0 ? 'var(--sage-dark)' : 'var(--coral-dark)') : 'var(--text-muted)';
      return `<b style="color:${c}">${d > 0 ? '+' : ''}${d}${big ? ' ●' : ''}</b>`;
    }
    function evLast(arr) { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return i; return -1; }

    function setEvalMs(v) { uiState.evalMs = v; renderApp(); }

    function saveAssessment() {
      const pat = getActivePatient(), sel = uiState.evalMs || 'basal', scores = {};
      for (const s of EV_SCALES) {
        const v = document.getElementById('ev_' + s.k).value;
        if (v === '') continue;
        const n = Number(v);
        if (isNaN(n) || n < 0 || n > s.max) { showToast(`${s.n}: ingresa un valor entre 0 y ${s.max}.`); return; }
        scores[s.k] = n;
      }
      if (!Object.keys(scores).length) { showToast('Ingresa al menos una escala.'); return; }
      const A = appState.assessments[pat.id] = appState.assessments[pat.id] || {};
      A[sel] = { date: new Date().toISOString().slice(0, 10), sessions: evData(pat.id).days.length, scores,
                 notes: document.getElementById('ev_notes').value.trim() };
      persistState();
      showToast('Evaluación guardada.');
      renderApp();
    }

    function setAdapt(k, v) {
      const p = getActivePatient();
      p.adapt = p.adapt || {}; p.adapt[k] = v;
      persistState(); applyAdaptations(p);
    }
    function applyAdaptations(p) {
      const a = (p && p.adapt) || {}, c = document.body.classList;
      c.toggle('ad-big', !!a.big); c.toggle('ad-neglect', !!a.neglect); c.toggle('ad-guard', !!a.guard);
    }
    // Tolerancia a toques accidentales: ignora un segundo toque dentro de 250 ms
    let _lastTap = 0;
    document.addEventListener('click', e => {
      if (!document.body.classList.contains('ad-guard')) return;
      const t = Date.now();
      if (t - _lastTap < 250) { e.stopPropagation(); e.preventDefault(); return; }
      _lastTap = t;
    }, true);

    function askFatigue(id) {
      if (document.getElementById('fatOv')) return;
      const d = document.createElement('div');
      d.id = 'fatOv'; d.className = 'fat-ov';
      d.innerHTML = `<div class="fat-box"><strong>¿Qué tan cansado/a te sientes?</strong>
        <div style="font-size:.85rem;color:var(--text-muted)">0 = nada · 10 = agotado/a</div>
        <div class="fat-row">${[...Array(11).keys()].map(n => `<button type="button" onclick="setFatigue('${id}',${n})">${n}</button>`).join('')}</div>
        <button type="button" onclick="document.getElementById('fatOv').remove()">Omitir</button></div>`;
      document.body.appendChild(d);
    }
    function setFatigue(id, n) {
      const e = appState.sessionHistory.find(h => h.id === id);
      if (e) { e.fatigue = n; persistState(); }
      const o = document.getElementById('fatOv'); if (o) o.remove();
      if (n >= 7) showToast('Fatiga alta: se sugiere una pausa antes de continuar.');
    }

    function EVAL_TAB_HTML() {
      const pat = getActivePatient();
      const has = (appState.assessments[pat.id] || {}).basal;
      return `<button type="button" class="nav-tab-btn ${appState.clinicalTab === 'evaluation' ? 'active-clinical-tab' : ''}" onclick="switchClinicalTab('evaluation')">
        <span style="font-size:1.25rem;">🧪</span>
        <span>Evaluación ${has ? '' : '<span class="nav-badge-count" style="background:var(--coral);">!</span>'}</span></button>`;
    }

        // =========================================================================
    // GRÁFICOS DE TENDENCIA E INFORME IMPRIMIBLE
    // =========================================================================
    function evChart(series, n, marks, labels) {
      const W = 300, H = 120, L = 26, R = 8, T = 8, B = 20, N = Math.max(n, 2);
      const X = i => L + i * (W - L - R) / (N - 1), Y = v => H - B - (v / 100) * (H - B - T);
      const grid = [0, 50, 100].map(g => `<line x1="${L}" x2="${W - R}" y1="${Y(g)}" y2="${Y(g)}" stroke="#D8E2E6"/><text x="${L - 3}" y="${Y(g) + 3}" font-size="8" text-anchor="end" fill="#64748B">${g}</text>`).join('');
      const mk = (marks || []).filter(m => m <= n).map(m => `<line x1="${X(m - 1)}" x2="${X(m - 1)}" y1="${T}" y2="${H - B}" stroke="#B6C6CC" stroke-dasharray="3 3"/><text x="${X(m - 1)}" y="${H - B + 10}" font-size="8" text-anchor="middle" fill="#64748B">${m}</text>`).join('');
      const lab = labels
        ? labels.map((t, i) => `<text x="${X(i)}" y="${H - 4}" font-size="8" text-anchor="middle" fill="#64748B">${t}</text>`).join('')
        : (n > 0 ? `<text x="${X(0)}" y="${H - 4}" font-size="8" text-anchor="middle" fill="#64748B">ses. 1</text><text x="${X(n - 1)}" y="${H - 4}" font-size="8" text-anchor="middle" fill="#64748B">${n}</text>` : '');
      const lines = series.map(s => {
        let p = '', up = false;
        s.v.forEach((v, i) => { if (v == null) { up = false; return; } p += (up ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); up = true; });
        const dots = s.v.map((v, i) => v == null ? '' : `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="${s.c}"/>`).join('');
        return `<path d="${p}" fill="none" stroke="${s.c}" stroke-width="2"/>${dots}`;
      }).join('');
      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">${grid}${mk}${lab}${lines}</svg>`;
    }

    function evChartsHTML(d, A) {
      if (!d.days.length && !Object.keys(A).length) return `<div class="ev-card ev-rep"><h3>Tendencias</h3><small>Aún no hay sesiones ni evaluaciones registradas.</small></div>`;
      const cols = ['#0F4C5C', '#2A9D8F', '#8C640B', '#E76F51', '#17687D'];
      const mini = Object.keys(EV_DOM).map((dm, i) => {
        const vals = d.days.map(day => {
          const a = d.h.filter(x => x.date === day && x.domain === dm && x.metrics && x.metrics[EV_DOM[dm][0]] != null);
          return a.length ? a.reduce((s, x) => s + x.metrics[EV_DOM[dm][0]], 0) / a.length : null;
        });
        return `<div><div style="font-weight:700;font-size:.8rem">${EV_DOM[dm][1]} (% por sesión)</div>${evChart([{ v: vals, c: cols[i] }], d.days.length, [10, 20, 30], null)}</div>`;
      }).join('');
      const sc = EV_SCALES.map((s, i) => ({
        n: s.n, c: cols[i],
        v: EV_MS.map(m => { const x = A[m.k] && A[m.k].scores ? A[m.k].scores[s.k] : null; return x == null ? null : x / s.max * 100; })
      }));
      const leg = sc.map(s => `<span style="color:${s.c};font-weight:700;font-size:.78rem;margin-right:.6rem">● ${s.n}</span>`).join('');
      return `<div class="ev-card ev-rep"><h3>Tendencias</h3>
        <div class="ev-grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">${mini}</div>
        <div style="margin:.8rem 0 .2rem;font-weight:700;font-size:.85rem">Escalas (% del máximo) por hito</div>${leg}
        <div style="max-width:420px">${evChart(sc, 4, [], EV_MS.map(m => m.n))}</div>
        <small style="color:var(--text-muted)">Líneas punteadas verticales: sesiones 10, 20 y 30. Los huecos indican dominios sin actividad ese día.</small></div>`;
    }

    function evNotesHTML(A) {
      const r = EV_MS.filter(m => A[m.k]).map(m => `<div style="margin:.3rem 0"><b>${m.n}</b> (${A[m.k].date}, ${A[m.k].sessions} ses.)${A[m.k].notes ? ': ' + A[m.k].notes : ''}</div>`).join('');
      return r ? `<div class="ev-card ev-rep"><h3>Evaluaciones registradas</h3>${r}</div>` : '';
    }

    function openReport() {
      const pat = getActivePatient(), d = evData(pat.id);
      const tmp = document.createElement('div');
      tmp.innerHTML = renderEvaluationView();
      const cards = [...tmp.querySelectorAll('.ev-rep')].map(e => e.outerHTML).join('');
      const old = document.getElementById('repOv'); if (old) old.remove();
      const o = document.createElement('div');
      o.id = 'repOv';
      o.innerHTML = `<div class="no-print" style="text-align:center;margin-bottom:.8rem">
          <button type="button" class="ev-btn" onclick="window.print()">🖨 Imprimir / Guardar PDF</button>
          <button type="button" class="ev-btn" style="background:var(--text-muted)" onclick="document.getElementById('repOv').remove()">Cerrar</button></div>
        <div class="rep-page">
          <h2 style="margin:0;color:var(--petrol)">Informe de evaluación y evolución — NeuroRehab</h2>
          <p style="margin:.4rem 0 1rem;font-size:.9rem">
            <b>Paciente:</b> ${pat.name} (${pat.age} años) · <b>Hemicuerpo afectado:</b> ${pat.affectedSide} · <b>Nivel motor:</b> ${pat.motorLevel}<br>
            <b>Diagnóstico:</b> ${pat.diagnosis}<br>
            <b>Profesional:</b> ${appState.therapistName} · <b>Emisión:</b> ${new Date().toISOString().slice(0, 10)} · <b>Sesiones registradas:</b> ${d.days.length}</p>
          ${cards}
          <div class="ev-card"><h3>Registro cronológico</h3><pre style="white-space:pre-wrap;font-size:.72rem;margin:0">${generateClinicalEvolutionReportText(pat, d.h)}</pre></div>
          <p style="font-size:.72rem;color:var(--text-muted)">Documento de apoyo generado por la app. Los umbrales de cambio son aproximados y no reemplazan el juicio clínico.</p>
        </div>`;
      document.body.appendChild(o);
      o.scrollTop = 0;
    }

    function renderEvaluationView() {
      const pat = getActivePatient(), d = evData(pat.id);
      const A = appState.assessments[pat.id] || {};
      const sel = uiState.evalMs || 'basal', cur = (A[sel] && A[sel].scores) || {};
      const opts = EV_MS.map(m => {
        const ok = m.k === 'basal' || d.days.length >= m.s;
        return `<option value="${m.k}" ${sel === m.k ? 'selected' : ''} ${ok ? '' : 'disabled'}>${m.n}${A[m.k] ? ' ✓' : ''}${ok ? '' : ' (faltan ' + (m.s - d.days.length) + ' ses.)'}</option>`;
      }).join('');
      const inputs = EV_SCALES.map(s => `<label>${s.n} (0–${s.max})<input id="ev_${s.k}" type="number" min="0" max="${s.max}" value="${cur[s.k] ?? ''}"></label>`).join('');
      const heads = EV_MS.map(m => `<th>${m.n}</th>`).join('');

      const scaleRows = EV_SCALES.map(s => {
        const v = EV_MS.map(m => (A[m.k] && A[m.k].scores) ? A[m.k].scores[s.k] : null);
        const li = evLast(v);
        return `<tr><td>${s.n}</td>${v.map(x => `<td>${x ?? '—'}</td>`).join('')}<td>${li > 0 && v[0] != null ? evDelta(v[0], v[li], s.ref) : '—'}</td></tr>`;
      }).join('');

      const W = EV_MS.map(m => { const e = evWindow(d, m.s); return e ? evDomainStats(e) : null; });
      const domRows = Object.keys(EV_DOM).map(dm => {
        const v = W.map(w => (w && w[dm]) ? w[dm] : null), idx = v.map(x => x ? x.idx : null), li = evLast(idx);
        return `<tr><td>${EV_DOM[dm][1]}</td>${v.map(x => `<td>${x ? x.raw + '% <small>(idx ' + x.idx + ')</small>' : '—'}</td>`).join('')}<td>${li > 0 && idx[0] != null ? evDelta(idx[0], idx[li], 10) : '—'}</td></tr>`;
      }).join('');

      const fat = d.h.filter(x => x.fatigue != null).map(x => x.fatigue);
      const pain = d.h.map(x => x.metrics && x.metrics.painEva).filter(x => x != null);
      const next = EV_MS.find(m => d.days.length < m.s);
      const ad = pat.adapt || {};
      const banner = !A.basal
        ? `<div class="ev-warn">⚠ Evaluación basal pendiente para ${pat.name}. Registra las escalas antes de iniciar el programa y completa las primeras 3 sesiones: serán su línea de base de desempeño.</div>`
        : (next ? `<div class="ev-warn" style="background:var(--sage-soft);border-color:var(--sage);color:var(--sage-dark)">Sesiones registradas: ${d.days.length}. Próximo hito: ${next.n} (faltan ${next.s - d.days.length}).</div>` : '');

      return `
      <div class="ev-card"><h3>🧪 Evaluación y análisis — ${pat.name}</h3>${banner}
        <label style="font-size:.85rem;font-weight:600">Hito a registrar
          <select onchange="setEvalMs(this.value)">${opts}</select></label>
        <div class="ev-grid" style="margin-top:.7rem">${inputs}</div>
        <label style="display:block;margin-top:.7rem;font-size:.85rem;font-weight:600">Observaciones
          <textarea id="ev_notes" rows="2" style="width:100%">${(A[sel] && A[sel].notes) || ''}</textarea></label>
        <button type="button" class="ev-btn" onclick="saveAssessment()">Guardar evaluación</button> <button type="button" class="ev-btn" style="background:var(--sage-dark)" onclick="openReport()">🖨 Informe imprimible</button> <button type="button" class="ev-btn" style="background:var(--petrol-mid)" onclick="exportCSV('hist')">⬇ CSV historial</button> <button type="button" class="ev-btn" style="background:var(--petrol-mid)" onclick="exportCSV('eval')">⬇ CSV evaluaciones</button></div>

      <div class="ev-card ev-rep"><h3>Escalas estandarizadas</h3><div class="ev-wrap"><table class="ev-tbl">
        <tr><th>Escala</th>${heads}<th>Δ vs basal</th></tr>${scaleRows}</table></div>
        <small style="color:var(--text-muted)">● = cambio ≥ diferencia de referencia aproximada (MoCA 2, Barthel 10, FM 5, ARAT 6, Denom. 10). Verificar umbrales en la literatura para esta población.</small></div>

      <div class="ev-card ev-rep"><h3>Desempeño en la app (3 sesiones por hito)</h3><div class="ev-wrap"><table class="ev-tbl">
        <tr><th>Dominio</th>${heads}<th>Δ idx</th></tr>${domRows}</table></div>
        <small style="color:var(--text-muted)">% = promedio bruto; idx = % ponderado por dificultad (Básico ×0.8, Intermedio ×1, Avanzado ×1.2). Un hito se calcula solo si hay suficientes sesiones.</small></div>

      ${evChartsHTML(d, A)}${evHemiHTML(d)}${evNotesHTML(A)}
      <div class="ev-card ev-rep"><h3>Seguridad y fatiga</h3>
        <div>Fatiga autorregistrada: ${fat.length ? 'media ' + (fat.reduce((a, b) => a + b, 0) / fat.length).toFixed(1) + '/10 (máx ' + Math.max(...fat) + ')' : 'sin registros'} · EVA motor máx: ${pain.length ? Math.max(...pain) + '/10' : 'sin registros'}</div></div>

      <div class="ev-card"><h3>Adaptaciones del paciente</h3>
        <label style="display:block;margin:.3rem 0"><input type="checkbox" ${ad.big ? 'checked' : ''} onchange="setAdapt('big',this.checked)"> Objetivos táctiles grandes</label>
        <label style="display:block;margin:.3rem 0"><input type="checkbox" ${ad.neglect ? 'checked' : ''} onchange="setAdapt('neglect',this.checked)"> Ancla visual en el borde izquierdo (apoyo en negligencia)</label>
        <label style="display:block;margin:.3rem 0"><input type="checkbox" ${ad.guard ? 'checked' : ''} onchange="setAdapt('guard',this.checked)"> Tolerancia a toques accidentales (ignora toque doble)</label>
        <label style="display:block;margin:.5rem 0;font-size:.85rem;font-weight:600">Go/No-Go: ubicación de las señales
          <select onchange="setAdapt('hemi',this.value)">
            ${[['center', 'Centro (sin hemicampo)'], ['balanced', 'Aleatoria 50/50 izquierda-derecha'], ['left', 'Reforzada hacia la izquierda (65%)'], ['right', 'Reforzada hacia la derecha (65%)']].map(o => `<option value="${o[0]}" ${(ad.hemi || 'center') === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
          </select></label></div>`;
    }

    function renderClinicalEvolutionView() {
      const pat = getActivePatient();
      const patHistory = appState.sessionHistory.filter(h => h.patientId === pat.id);

      const inh = patHistory.filter(h => h.domain === 'inhibitory');
      const mem = patHistory.filter(h => h.domain === 'memory');
      const adl = patHistory.filter(h => h.domain === 'adl');
      const lan = patHistory.filter(h => h.domain === 'language');
      const mot = patHistory.filter(h => h.domain === 'motor');

      const avgRt = inh.length ? Math.round(inh.reduce((a, b) => a + (b.metrics.meanRtMs || 0), 0) / inh.length) + ' ms' : '—';
      const avgNogo = inh.length ? Math.round(inh.reduce((a, b) => a + (b.metrics.nogoAccPct || 0), 0) / inh.length) + '%' : '—';
      const avgMem = mem.length ? Math.round(mem.reduce((a, b) => a + (b.metrics.recallPct || 0), 0) / mem.length) + '%' : '—';
      const avgAdl = adl.length ? Math.round(adl.reduce((a, b) => a + (b.metrics.adlAutonomyPct || 0), 0) / adl.length) + '%' : '—';
      const avgLan = lan.length ? Math.round(lan.reduce((a, b) => a + (b.metrics.namingScorePct || 0), 0) / lan.length) + '%' : '—';

      const totEff = mot.reduce((a, b) => a + (b.metrics.effectiveReps || 0), 0);
      const totComp = mot.reduce((a, b) => a + (b.metrics.compensatedReps || 0), 0);
      const motQual = (totEff + totComp) > 0 ? Math.round((totEff / (totEff + totComp)) * 100) + '%' : '—';

      const reportText = generateClinicalEvolutionReportText(pat, patHistory);

      return `
        <section class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.65rem;margin-bottom:0.9rem;">
            <div>
              <span class="eyebrow">Analítica y Ficha Clínica</span>
              <h2 class="section-title">Evolución Integral: ${pat.name}</h2>
            </div>
            <div class="no-print" style="display:flex;gap:0.45rem;flex-wrap:wrap;">
              <button type="button" class="btn btn-petrol btn-sm" onclick="copyEvolutionReport()">📋 Copiar Informe</button>
              <button type="button" class="btn btn-sage btn-sm" onclick="window.print()">🖨 Imprimir / PDF</button>
              <button type="button" class="btn btn-outline btn-sm" onclick="exportClinicalJSON()">⬇ JSON</button>
              <label class="btn btn-outline btn-sm" style="cursor:pointer;">
                ⬆ JSON
                <input type="file" accept=".json" style="display:none;" onchange="importClinicalJSON(event)" />
              </label>
            </div>
          </div>

          <div class="kpi-grid">
            <div class="kpi-box">
              <div class="kpi-label">Control Inhibitorio</div>
              <div class="kpi-val">${avgRt}</div>
              <div class="kpi-sub">Inhibición No-Go: ${avgNogo}</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">Memoria Episódica</div>
              <div class="kpi-val">${avgMem}</div>
              <div class="kpi-sub">${mem.length} sesiones evaluadas</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">Autonomía AVD</div>
              <div class="kpi-val">${avgAdl}</div>
              <div class="kpi-sub">${adl.length} escenarios resueltos</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">Lenguaje / Denominación</div>
              <div class="kpi-val">${avgLan}</div>
              <div class="kpi-sub">${lan.length} bloques registrados</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-label">Movilidad ES (Calidad)</div>
              <div class="kpi-val">${motQual}</div>
              <div class="kpi-sub">${totEff} efectivas / ${totComp} comp.</div>
            </div>
          </div>

          <h3 class="section-title" style="font-size:1.05rem;margin-top:0.5rem;">Historial de Sesiones (${patHistory.length})</h3>
          <div class="table-wrap" style="margin-bottom:1.1rem;">
            <table>
              <thead>
                <tr>
                  <th>Fecha / Hora</th>
                  <th>Dominio</th>
                  <th>Actividad</th>
                  <th>Métricas Objetivas</th>
                </tr>
              </thead>
              <tbody>
                ${patHistory.length === 0
                  ? `<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:1rem;">Aún no hay sesiones registradas para ${pat.name}.</td></tr>`
                  : patHistory.map(h => `
                    <tr>
                      <td style="white-space:nowrap;">${h.date}<br><span style="color:var(--text-muted);font-size:0.75rem;">${h.time}</span></td>
                      <td><span class="badge ${DOMAIN_META[h.domain]?.badgeClass || 'badge-petrol'}">${DOMAIN_META[h.domain]?.shortName || h.domain}</span></td>
                      <td><b>${h.activityTitle}</b></td>
                      <td>${h.summaryText}</td>
                    </tr>
                  `).join('')
                }
              </tbody>
            </table>
          </div>

          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;flex-wrap:wrap;gap:0.4rem;">
              <strong style="font-size:0.92rem;color:var(--petrol-dark);">Nota de Evolución Clínica (Generada Automáticamente):</strong>
              <button type="button" class="btn btn-petrol btn-sm no-print" onclick="copyEvolutionReport()">📋 Copiar Nota Clínica</button>
            </div>
            <div class="clinical-report-pre">${reportText}</div>
          </div>
        </section>
      `;
    }

    // =========================================================================
    // 15. INITIALIZATION ON DOM CONTENT LOADED
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      setFontSize(appState.fontSize || 'normal');
      const soundBtn = document.getElementById('btnSoundToggle');
      if (soundBtn) soundBtn.textContent = appState.soundEnabled ? '🔊 Audio' : '🔇 Mudo';
      renderApp();
    });
  </script>
</body>
</html>
