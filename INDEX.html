<!DOCTYPE html>
<html lang="es" data-font-size="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F4C5C" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NeuroRehab" />
  <meta name="format-detection" content="telephone=no" />
  <title>NeuroRehab App - Estimulación Cognitiva Integral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       1. CLINICAL DESIGN TOKENS & ACCESSIBLE TYPOGRAPHY SCALE
       Palette:
       - Deep Petrol Blue: #0F4C5C
       - Therapeutic Sage Green: #2A9D8F
       - Warm Light Gray Background: #F4F7F8
       - Pure White Cards: #FFFFFF
       - Soft Amber: #E9C46A
       - Coral (No-Go / Alerts): #E76F51
       - Slate Text: #1E293B
       ========================================================================= */
    :root {
      --petrol: #0F4C5C;
      --petrol-dark: #09333E;
      --petrol-mid: #17687D;
      --petrol-soft: #E3F0F3;

      --sage: #2A9D8F;
      --sage-dark: #1F7A6F;
      --sage-soft: #E1F4F1;

      --bg-app: #F4F7F8;
      --bg-card: #FFFFFF;
      --bg-muted: #EAF0F2;

      --amber: #E9C46A;
      --amber-dark: #8C640B;
      --amber-soft: #FDF6E4;

      --coral: #E76F51;
      --coral-dark: #B54225;
      --coral-soft: #FDECE8;

      --text-main: #1E293B;
      --text-secondary: #475569;
      --text-muted: #64748B;

      --border-light: #D8E2E6;
      --border-strong: #B6C6CC;

      --shadow-xs: 0 1px 3px rgba(15, 76, 92, 0.06);
      --shadow-sm: 0 4px 12px rgba(15, 76, 92, 0.08);
      --shadow-md: 0 8px 24px rgba(15, 76, 92, 0.12);

      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;

      --base-font: 16px;
      --bottom-nav-h: 76px;
    }

    html[data-font-size="normal"] { --base-font: 16px; }
    html[data-font-size="large"]  { --base-font: 18px; }
    html[data-font-size="xlarge"] { --base-font: 20.5px; }
    /* Evaluación, fatiga y adaptaciones */
    .ev-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:1rem;margin:0 0 1rem;box-shadow:var(--shadow-xs)}
    .ev-card h3{margin:0 0 .6rem;font-size:1.05rem;color:var(--petrol)}
    .ev-wrap{overflow-x:auto}
    .ev-tbl{width:100%;border-collapse:collapse;font-size:.85rem}
    .ev-tbl th,.ev-tbl td{padding:.4rem .5rem;border-bottom:1px solid var(--border-light);text-align:center}
    .ev-tbl th:first-child,.ev-tbl td:first-child{text-align:left}
    .ev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem}
    .ev-grid label{display:flex;flex-direction:column;font-size:.8rem;font-weight:600;gap:.2rem}
    .ev-card input[type=number],.ev-card select,.ev-card textarea{padding:.5rem;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font:inherit}
    .ev-btn{background:var(--petrol);color:#fff;border:0;border-radius:var(--radius-md);padding:.65rem 1rem;font:inherit;font-weight:700;cursor:pointer;margin-top:.7rem}
    .ev-warn{background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber-dark);border-radius:var(--radius-md);padding:.7rem;margin-bottom:.8rem;font-weight:600}
    .fat-ov{position:fixed;inset:0;background:rgba(9,51,62,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
    .fat-box{background:#fff;border-radius:var(--radius-lg);padding:1.2rem;max-width:420px;text-align:center}
    .fat-row{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.8rem 0}
    .fat-row button,.fat-box>button{min-width:44px;min-height:44px;border:1px solid var(--border-strong);background:var(--bg-app);border-radius:var(--radius-sm);font:inherit;font-weight:700;cursor:pointer}
    body.ad-big button,body.ad-big select,body.ad-big input{min-height:56px}
        .hf-wrap{position:relative;width:100%;min-height:150px;display:flex;align-items:center}
    .hf-fix{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.6rem;font-weight:800;color:var(--text-muted)}
    .hf-stim{width:40%;text-align:center}
    .hf-stim.hf-left{margin-right:auto}
    .hf-stim.hf-right{margin-left:auto}
    .hf-stim div{font-size:.85rem!important}
        .cam-panel{position:fixed;right:.6rem;bottom:calc(var(--bottom-nav-h) + .6rem);width:min(270px,92vw);background:#fff;border:1px solid var(--border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-md);z-index:250;padding:.5rem;font-size:.76rem}
    .cam-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem}
    .cam-head button,.cam-btns button{border:1px solid var(--border-strong);background:var(--bg-app);border-radius:var(--radius-sm);padding:.3rem .45rem;font:inherit;font-weight:700;cursor:pointer;min-height:34px}
    #camCv{width:100%;height:auto;background:#222;border-radius:var(--radius-sm);transform:scaleX(-1);cursor:crosshair;display:block}
    .cam-msg{margin:.35rem 0;color:var(--text-secondary)}
    .cam-btns{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.3rem}
    .cam-panel label{display:block;margin:.2rem 0}
    .cam-stat{font-weight:700;color:var(--petrol)}
        /* ===== Diseño móvil ===== */
    :root{--bottom-nav-h:calc(76px + env(safe-area-inset-bottom, 0px))}
    html{-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
    button,select,input,label,a{touch-action:manipulation}
    .app-header{padding-top:calc(.65rem + env(safe-area-inset-top, 0px));padding-left:max(.9rem,env(safe-area-inset-left, 0px));padding-right:max(.9rem,env(safe-area-inset-right, 0px))}
    .app-viewport{padding-left:max(.9rem,env(safe-area-inset-left, 0px));padding-right:max(.9rem,env(safe-area-inset-right, 0px))}
    .bottom-nav{padding-bottom:calc(.35rem + env(safe-area-inset-bottom, 0px))}
    .bottom-nav-inner{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
    .nav-tab-btn{min-width:0}
    .nav-tab-btn span:last-child{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .gonogo-arena button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .ev-tbl{min-width:430px}
    #repOv{padding:calc(1rem + env(safe-area-inset-top, 0px)) 1rem calc(1rem + env(safe-area-inset-bottom, 0px))}
    @media (pointer:coarse){button,select{min-height:44px}}
    @media (max-width:600px){
      .input-ctrl,.select-ctrl,.textarea-ctrl,.ev-card input,.ev-card select,.ev-card textarea{font-size:16px}
      .nav-tab-btn{font-size:.7rem}
      .cam-panel{left:.6rem;right:.6rem;width:auto}
    }
    @media (max-height:500px) and (orientation:landscape){
      .gonogo-stage{min-height:120px}
      .btn-tap-go{min-height:64px}
    }
    @media print{.ev-tbl{min-width:0}}
    body.ad-neglect::before{content:"";position:fixed;left:0;top:0;bottom:0;width:12px;background:var(--amber);z-index:70}
    #repOv{position:fixed;inset:0;background:#fff;z-index:300;overflow:auto;padding:1rem}
    .rep-page{max-width:820px;margin:0 auto}
    @media print{
      body>*:not(#repOv){display:none!important}
      body::before{display:none!important}
      #repOv{position:static;overflow:visible;padding:0}
      .no-print{display:none!important}
      .ev-card{box-shadow:none;break-inside:avoid}
    }



    html {
      font-size: var(--base-font);
      scroll-behavior: smooth;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* =========================================================================
       2. MOBILE-FIRST APP SHELL: STICKY TOP HEADER
       ========================================================================= */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 60;
      background: var(--petrol);
      color: #FFFFFF;
      box-shadow: 0 3px 14px rgba(9, 51, 62, 0.2);
      padding: 0.65rem 0.9rem;
    }

    .app-header-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    @media (min-width: 768px) {
      .app-header-inner {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .brand-logo-wrap {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.13);
      border: 1px solid rgba(255, 255, 255, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-name {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .patient-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 2px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #D6ECEF;
      background: rgba(9, 51, 62, 0.55);
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      max-width: 100%;
    }

    .patient-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sage);
      flex-shrink: 0;
    }

    .header-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* Font Size Selector (A / A+ / A++) */
    .font-scale-group {
      display: inline-flex;
      align-items: center;
      background: var(--petrol-dark);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }

    .font-scale-btn {
      border: none;
      background: transparent;
      color: #CBE4E8;
      font-family: inherit;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 0.3rem 0.58rem;
      border-radius: 999px;
      cursor: pointer;
      min-height: 32px;
      min-width: 34px;
      transition: background 0.15s, color 0.15s;
    }

    .font-scale-btn.active {
      background: #FFFFFF;
      color: var(--petrol-dark);
    }

    /* Prominent Dual Mode Switcher */
    .mode-switcher {
      display: inline-flex;
      align-items: center;
      background: var(--petrol-dark);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
      flex: 1;
      max-width: 330px;
    }

    .mode-switch-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: #D2E8EC;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.42rem 0.65rem;
      border-radius: 999px;
      cursor: pointer;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .mode-switch-btn.active-user {
      background: var(--sage);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(42, 157, 143, 0.45);
    }

    .mode-switch-btn.active-clinical {
      background: var(--amber);
      color: #241A03;
      box-shadow: 0 2px 8px rgba(233, 196, 106, 0.4);
    }

    /* =========================================================================
       3. APP MAIN VIEWPORT & FIXED BOTTOM NAVIGATION BAR
       ========================================================================= */
    .app-viewport {
      max-width: 980px;
      margin: 0 auto;
      padding: 1rem 0.9rem calc(var(--bottom-nav-h) + 1.5rem) 0.9rem;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-nav-h);
      background: #FFFFFF;
      border-top: 1.5px solid var(--border-light);
      box-shadow: 0 -4px 16px rgba(15, 76, 92, 0.08);
      z-index: 60;
      display: flex;
      justify-content: center;
      padding: 0.35rem 0.5rem;
    }

    .bottom-nav-inner {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
    }

    .nav-tab-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      padding: 0.3rem 0.25rem;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .nav-tab-btn:active { transform: scale(0.97); }

    .nav-tab-btn.active-user-tab {
      background: var(--sage-soft);
      color: var(--sage-dark);
    }

    .nav-tab-btn.active-clinical-tab {
      background: var(--petrol-soft);
      color: var(--petrol);
    }

    .nav-badge-count {
      background: var(--petrol);
      color: #FFFFFF;
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 999px;
      margin-left: 3px;
    }

    /* =========================================================================
       4. SHARED CARDS, BUTTONS, BADGES & FORM CONTROLS
       ========================================================================= */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.15rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-xs);
    }

    .card-highlight-petrol {
      border: 2px solid var(--petrol);
      box-shadow: var(--shadow-sm);
    }

    .card-highlight-sage {
      border: 2px solid var(--sage);
      box-shadow: var(--shadow-sm);
    }

    .eyebrow {
      display: block;
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--petrol);
      margin-bottom: 0.25rem;
    }

    .section-title {
      margin: 0 0 0.35rem 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--petrol-dark);
      line-height: 1.25;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.68rem;
      border-radius: 999px;
    }

    .badge-petrol { background: var(--petrol-soft); color: var(--petrol-dark); }
    .badge-sage   { background: var(--sage-soft); color: var(--sage-dark); }
    .badge-amber  { background: var(--amber-soft); color: var(--amber-dark); border: 1px solid #EBD085; }
    .badge-coral  { background: var(--coral-soft); color: var(--coral-dark); border: 1px solid #F0A693; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      border-radius: var(--radius-md);
      border: 1.5px solid transparent;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 0.65rem 1.05rem;
      min-height: 48px;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.48; cursor: not-allowed; }

    .btn-petrol { background: var(--petrol); color: #FFFFFF; }
    .btn-petrol:hover:not(:disabled) { background: var(--petrol-mid); }

    .btn-sage { background: var(--sage); color: #FFFFFF; }
    .btn-sage:hover:not(:disabled) { background: var(--sage-dark); }

    .btn-amber { background: var(--amber); color: #261C04; }
    .btn-amber:hover:not(:disabled) { background: #DFB54B; }

    .btn-coral { background: var(--coral); color: #FFFFFF; }
    .btn-coral:hover:not(:disabled) { background: var(--coral-dark); }

    .btn-outline {
      background: #FFFFFF;
      color: var(--text-main);
      border-color: var(--border-strong);
    }
    .btn-outline:hover:not(:disabled) { background: var(--bg-muted); }

    .btn-sm {
      min-height: 38px;
      padding: 0.38rem 0.75rem;
      font-size: 0.82rem;
      border-radius: var(--radius-sm);
    }

    .btn-block { width: 100%; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
    }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
    }

    .input-ctrl, .select-ctrl, .textarea-ctrl {
      width: 100%;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.75rem;
      font-family: inherit;
      font-size: 0.92rem;
      background: #FFFFFF;
      color: var(--text-main);
      min-height: 46px;
    }

    .input-ctrl:focus, .select-ctrl:focus, .textarea-ctrl:focus {
      outline: none;
      border-color: var(--petrol);
      box-shadow: 0 0 0 3px var(--petrol-soft);
    }

    .progress-track {
      height: 12px;
      background: var(--bg-muted);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-light);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--petrol) 0%, var(--sage) 100%);
      transition: width 0.3s ease;
    }

    /* =========================================================================
       5. USER MODE: PLAN CARDS, DOMAIN GRID & ACHIEVEMENTS
       ========================================================================= */
    .hero-welcome {
      background: linear-gradient(135deg, var(--petrol) 0%, #156275 100%);
      color: #FFFFFF;
      border-radius: var(--radius-xl);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-sm);
    }

    .domain-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 0.9rem;
    }

    .domain-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .domain-card:hover {
      border-color: var(--sage);
      box-shadow: var(--shadow-sm);
    }

    .domain-card-head {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
    }

    .svg-icon-box {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: var(--petrol-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .plan-task-card {
      background: #FFFFFF;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 1.1rem;
      margin-bottom: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .plan-task-card.completed {
      border-color: var(--sage);
      background: #F4FBF9;
    }

    /* =========================================================================
       6. TRAINING ENGINES: DOMAIN-SPECIFIC INTERACTIVE UI
       ========================================================================= */
    /* Engine 1: Go / No-Go Adaptive Arena */
    .gonogo-arena {
      background: var(--bg-app);
      border: 2px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: 1.25rem;
      text-align: center;
      margin: 0.85rem 0;
    }

    .gonogo-stage {
      min-height: 195px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      border: 2px dashed var(--border-strong);
      padding: 1rem;
      margin-bottom: 1rem;
      transition: border-color 0.15s, background 0.15s;
    }

    .gonogo-stage.stim-go {
      border: 3px solid var(--sage);
      background: #F2FBF9;
    }

    .gonogo-stage.stim-nogo {
      border: 3px solid var(--coral);
      background: #FEF5F2;
    }

    .gonogo-stage.stim-prospective {
      border: 3px solid var(--amber-dark);
      background: var(--amber-soft);
    }

    .gonogo-pad-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    .gonogo-pad-row.with-dual {
      grid-template-columns: 1.35fr 1fr;
    }

    .btn-tap-go {
      min-height: 92px;
      border-radius: var(--radius-lg);
      border: none;
      background: var(--sage);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(42, 157, 143, 0.28);
    }

    .btn-tap-go:active { transform: scale(0.97); }

    .btn-tap-prospective {
      min-height: 92px;
      border-radius: var(--radius-lg);
      border: 2px solid #D6A836;
      background: var(--amber);
      color: #261C04;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* Engine 2: Episodic & Prospective Memory Cards */
    .mem-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 0.75rem;
    }

    .mem-item-card {
      background: #FFFFFF;
      border: 2px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 0.8rem 0.65rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .mem-item-card.consolidated, .mem-item-card.selected {
      border-color: var(--sage);
      background: var(--sage-soft);
      box-shadow: 0 0 0 2px rgba(42, 157, 143, 0.2);
    }

    .interference-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.55rem;
      max-width: 360px;
      margin: 0.85rem auto;
    }

    .num-tile-btn {
      min-height: 58px;
      border-radius: var(--radius-md);
      border: 2px solid var(--petrol);
      background: #FFFFFF;
      color: var(--petrol-dark);
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
    }

    .num-tile-btn.done {
      background: var(--sage);
      border-color: var(--sage);
      color: #FFFFFF;
    }

    /* Engine 3: ADL/IADL Sequential Slots (Accessible Touch-to-Place) */
    .adl-slots-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }

    .adl-slot {
      min-height: 62px;
      border-radius: var(--radius-md);
      border: 2px dashed var(--border-strong);
      background: var(--bg-app);
      padding: 0.55rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      cursor: pointer;
    }

    .adl-slot.filled {
      border-style: solid;
      border-color: var(--petrol);
      background: #FFFFFF;
    }

    .adl-step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--petrol);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .adl-pool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.6rem;
    }

    .adl-choice-btn {
      min-height: 62px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-strong);
      background: #FFFFFF;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 0.6rem 0.8rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .adl-choice-btn:hover {
      border-color: var(--sage);
      background: var(--sage-soft);
    }

    /* Engine 4: Language Cue Hierarchy & SFA Map */
    .cue-step-card {
      background: var(--bg-app);
      border-left: 4px solid var(--petrol);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.85rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .sfa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.65rem;
    }

    .sfa-node {
      background: #FFFFFF;
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sfa-node.explored {
      border-color: var(--sage);
      background: var(--sage-soft);
    }

    /* Engine 5: Upper Extremity Motor Workstation */
    .motor-timer-digits {
      font-size: 2.85rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--petrol-dark);
      line-height: 1.05;
    }

    .rhythm-orb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #CBD5E1;
      transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
      flex-shrink: 0;
    }

    .rhythm-orb.pulse {
      background: var(--sage);
      transform: scale(1.38);
      box-shadow: 0 0 0 6px var(--sage-soft);
    }

    .btn-motor-eff {
      width: 100%;
      min-height: 108px;
      border-radius: var(--radius-lg);
      border: none;
      background: var(--sage);
      color: #FFFFFF;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.75rem;
      box-shadow: 0 6px 16px rgba(42, 157, 143, 0.26);
    }

    .btn-motor-comp {
      width: 100%;
      min-height: 62px;
      border-radius: var(--radius-md);
      border: 2px solid #D6A836;
      background: var(--amber);
      color: #261C04;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      padding: 0.55rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .eva-pill {
      min-width: 38px;
      min-height: 38px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-strong);
      background: #FFFFFF;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .eva-pill.safe { background: var(--sage); border-color: var(--sage); color: #FFFFFF; }
    .eva-pill.warn { background: var(--coral); border-color: var(--coral); color: #FFFFFF; }

    /* =========================================================================
       7. CLINICAL ANALYTICS, TABLES & REPORT
       ========================================================================= */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 0.7rem;
      margin-bottom: 1rem;
    }

    .kpi-box {
      background: var(--bg-app);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 0.75rem;
    }

    .kpi-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .kpi-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--petrol-dark);
      margin-top: 2px;
    }

    .kpi-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
      background: #FFFFFF;
    }

    th, td {
      padding: 0.6rem 0.55rem;
      border-bottom: 1px solid var(--border-light);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: var(--bg-muted);
      color: var(--petrol-dark);
      font-weight: 800;
      white-space: nowrap;
    }

    .clinical-report-pre {
      background: var(--bg-app);
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius-md);
      padding: 0.95rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      line-height: 1.5;
      color: var(--text-main);
    }

    .toast-banner {
      position: fixed;
      bottom: calc(var(--bottom-nav-h) + 12px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--petrol-dark);
      color: #FFFFFF;
      padding: 0.7rem 1.2rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      z-index: 999;
      display: none;
      max-width: 92vw;
      text-align: center;
    }

    @media print {
      body { background: #FFFFFF; }
      .app-header, .bottom-nav, .no-print, .toast-banner { display: none !important; }
      .app-viewport { max-width: 100%; padding: 0; }
      .card { box-shadow: none; border: 1px solid #CCCCCC; break-inside: avoid; }
    }
  </style>
</head>

    function getPatientTheme(pat) {
      if (!pat) return PATIENT_COLOR_THEMES[0];
      return PATIENT_COLOR_THEMES.find(t => t.id === pat.themeColor) || PATIENT_COLOR_THEMES[0];

    function applyPatientTheme(pat) {
      const t = getPatientTheme(pat);
      const r = document.documentElement.style;
      r.setProperty('--petrol', t.main);
      r.setProperty('--petrol-dark', t.dark);
      r.setProperty('--petrol-mid', t.mid);
      r.setProperty('--petrol-soft', t.soft);
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', t.main);
    }

    // =========================================================================
    // ALEATORIZACIÓN POR HEMICAMPO (Go/No-Go): estímulo a izquierda/derecha con fijación central
    // Modos (adapt.hemi): center | balanced (50/50) | left | right (65% hacia ese lado)
    // =========================================================================
    function hemiModeNow() { const p = getActivePatient(); return (p && p.adapt && p.adapt.hemi) || 'center'; }
    function nextHemiSide(eng) {
      const m = eng.hemiMode || 'center';
      if (m === 'center') return 'center';
      let side = m === 'balanced' ? (Math.random() < 0.5 ? 'left' : 'right')
        : (Math.random() < 0.65 ? m : (m === 'left' ? 'right' : 'left'));
      const h = eng.sideHist = eng.sideHist || [];
      if (h.length >= 3 && h.slice(-3).every(x => x === side)) side = side === 'left' ? 'right' : 'left';
      h.push(side);
      return side;
    }
    const hemiPct = x => x.tot ? Math.round(x.hit / x.tot * 100) : null;
    const hemiRt = x => x.rt.length ? Math.round(x.rt.reduce((a, b) => a + b, 0) / x.rt.length) : null;
    function hemiMetrics(eng) {
      const s = eng.stats.side;
      if (!s || !eng.hemiMode || eng.hemiMode === 'center') return {};
      return { hemiMode: eng.hemiMode, leftPct: hemiPct(s.left), rightPct: hemiPct(s.right),
               leftRt: hemiRt(s.left), rightRt: hemiRt(s.right), leftN: s.left.tot, rightN: s.right.tot };
    }
    function hemiText(eng) {
      const m = hemiMetrics(eng);
      return m.hemiMode ? ` · Izq ${m.leftPct ?? '—'}% (${m.leftRt ?? '—'} ms) / Der ${m.rightPct ?? '—'}% (${m.rightRt ?? '—'} ms)` : '';
    }
    function hemiSummaryHTML(eng) {
      const m = hemiMetrics(eng);
      if (!m.hemiMode) return '';
      const dp = (m.rightPct != null && m.leftPct != null) ? m.rightPct - m.leftPct : null;
      return `<div class="ev-card" style="margin-top:.9rem"><h3 style="font-size:.95rem">Respuesta por hemicampo</h3>
        <table class="ev-tbl"><tr><th></th><th>Izquierdo</th><th>Derecho</th></tr>
        <tr><td>Aciertos a objetivos</td><td>${m.leftPct ?? '—'}% (n=${m.leftN})</td><td>${m.rightPct ?? '—'}% (n=${m.rightN})</td></tr>
        <tr><td>TR medio</td><td>${m.leftRt ?? '—'} ms</td><td>${m.rightRt ?? '—'} ms</td></tr></table>
        <small style="color:var(--text-muted)">${dp != null && Math.abs(dp) >= 15 ? '● Diferencia entre lados ≥ 15 puntos: orientativa, con pocos ensayos por lado; interpretar con el contexto clínico.' : 'Pocos ensayos por lado: interpretar con cautela.'}</small></div>`;

    function evHemiHTML(d) {
      const rows = EV_MS.map(m => {
        const e = evWindow(d, m.s);
        const a = (e || []).filter(x => x.metrics && x.metrics.leftPct != null && x.metrics.rightPct != null);
        if (!a.length) return `<tr><td>${m.n}</td><td>—</td><td>—</td><td>—</td></tr>`;
        const L = Math.round(a.reduce((s, x) => s + x.metrics.leftPct, 0) / a.length);
        const R = Math.round(a.reduce((s, x) => s + x.metrics.rightPct, 0) / a.length);
        return `<tr><td>${m.n}</td><td>${L}%</td><td>${R}%</td><td>${evDelta(L, R, 15)}</td></tr>`;
      }).join('');

      return `<div class="ev-card ev-rep"><h3>Asimetría por hemicampo (Go/No-Go)</h3><table class="ev-tbl">
        <tr><th>Hito</th><th>Izq.</th><th>Der.</th><th>Δ (Der−Izq)</th></tr>${rows}</table>

    // =========================================================================
    // ESTIMACIÓN DE MOVIMIENTO CON CÁMARA (marcadores de color, procesamiento local)
    // Sigue un marcador en la muñeca (y opcional en el tronco): cuenta repeticiones,
    // mide amplitud RELATIVA (% del ancho de imagen) y detecta compensación de tronco.
    // El video no se guarda ni se envía: se analiza en el dispositivo.
    // =========================================================================
    const CAM = { W: 160, H: 120, stream: null, video: null, ctx: null, timer: null, last: null,
                  wrist: null, trunk: null, pick: null, st: null, rep: null, wp: null, tp: null,
                  counting: false, auto: true, minAmp: 0.10 };
    const CAM_TRUNK_THR = 0.05;

    function camHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
      let h = 0;
      if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return [(h * 60 + 360) % 360, mx ? d / mx : 0, mx];
    }
    // Centroide (normalizado 0-1) de los píxeles cuyo color coincide con el marcador
    function camFindMarker(data, w, h, m) {
      let sx = 0, sy = 0, n = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4, hv = camHsv(data[i], data[i + 1], data[i + 2]);
        if (hv[1] < 0.4 || hv[2] < 0.3) continue;
        const dh = Math.abs(hv[0] - m.h);
        if (Math.min(dh, 360 - dh) <= m.tol) { sx += x; sy += y; n++; }
      }
      return n >= 10 ? { x: sx / n / w, y: sy / n / h, n } : null;
    }
    // Máquina de estados con histéresis: sube sobre minAmp y vuelve bajo 40% de minAmp = 1 repetición
    function camStep(st, wp, tp, minAmp, now) {
      if (!wp || !st || !st.rest) return null;
      const k = CAM.H / CAM.W;
      const d = Math.hypot(wp.x - st.rest.x, (wp.y - st.rest.y) * k);
      const td = (tp && st.trest) ? Math.hypot(tp.x - st.trest.x, (tp.y - st.trest.y) * k) : 0;
      if (!st.up) { if (d >= minAmp) { st.up = true; st.t0 = now; st.peak = d; st.tmax = td; } return null; }
      st.peak = Math.max(st.peak, d); st.tmax = Math.max(st.tmax, td);
      if (d <= minAmp * 0.4) {
        st.up = false;
        const ms = now - st.t0;
        if (ms < 400) return null;
        return { amp: st.peak, ms, comp: st.trest ? st.tmax >= CAM_TRUNK_THR : null };
      }
      return null;
    }

    function camMsg(t) { const e = document.getElementById('camMsg'); if (e) e.textContent = t; }
    function camOpen() {
      if (document.getElementById('camPanel')) return;
      const d = document.createElement('div');
      d.id = 'camPanel'; d.className = 'cam-panel';
      d.innerHTML = `<div class="cam-head"><b>📷 Asistente de cámara</b><button type="button" onclick="camClose()">✕</button></div>
        <canvas id="camCv" width="160" height="120" onclick="camPick(event)"></canvas>
        <div id="camMsg" class="cam-msg">Pega una pegatina de color vivo en la muñeca (y otra en el esternón o el hombro). Pulsa «Iniciar».</div>
        <div class="cam-btns"><button type="button" onclick="camStart()">▶ Iniciar</button>
          <button type="button" onclick="camSetPick('wrist')">1 Muñeca</button>
          <button type="button" onclick="camSetPick('trunk')">2 Tronco</button>
          <button type="button" onclick="camSetRest()">3 Reposo</button></div>
        <label>Amplitud mínima <select onchange="CAM.minAmp=+this.value"><option value="0.06">Pequeña</option><option value="0.10" selected>Media</option><option value="0.15">Grande</option></select></label>
        <label><input type="checkbox" checked onchange="CAM.auto=this.checked"> Sumar al conteo automáticamente</label>
        <div id="camStat" class="cam-stat"></div>`;
      document.body.appendChild(d);
    }
    async function camStart() {
      if (CAM.stream) return;
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { camMsg('Este navegador no permite usar la cámara aquí.'); return; }
      try {
        CAM.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } }, audio: false });
      } catch (e) {
        camMsg('No se pudo acceder a la cámara. Revisa el permiso del navegador; si la app está dentro de otra página, descárgala y ábrela directamente en el navegador.');
        return;
      }
      const v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.srcObject = CAM.stream;
      try { await v.play(); } catch (e) {}
      CAM.video = v;
      CAM.ctx = document.getElementById('camCv').getContext('2d', { willReadFrequently: true });
      CAM.timer = setInterval(camLoop, 70);
      camMsg('Pulsa «1 Muñeca» y toca el marcador en la imagen. Luego «2 Tronco» (opcional) y «3 Reposo» con el brazo en reposo.');
    }
    function camLoop() {
      const v = CAM.video, cx = CAM.ctx;
      if (!v || !cx || v.readyState < 2) return;
      cx.drawImage(v, 0, 0, CAM.W, CAM.H);
      const img = CAM.last = cx.getImageData(0, 0, CAM.W, CAM.H);
      CAM.wp = CAM.wrist ? camFindMarker(img.data, CAM.W, CAM.H, CAM.wrist) : null;
      CAM.tp = CAM.trunk ? camFindMarker(img.data, CAM.W, CAM.H, CAM.trunk) : null;
      [[CAM.wp, '#2A9D8F'], [CAM.tp, '#E9C46A']].forEach(([p, c]) => {
        if (p) { cx.strokeStyle = c; cx.lineWidth = 2; cx.beginPath(); cx.arc(p.x * CAM.W, p.y * CAM.H, 8, 0, 6.283); cx.stroke(); }
      });
      if (CAM.counting) { const ev = camStep(CAM.st, CAM.wp, CAM.tp, CAM.minAmp, performance.now()); if (ev) camOnRep(ev); }
      const s = document.getElementById('camStat');
      if (s) s.textContent = `Muñeca: ${CAM.wp ? '✓' : '—'} · Tronco: ${CAM.tp ? '✓' : '—'}` + (CAM.rep ? ` · Reps: ${CAM.rep.n} (comp. ${CAM.rep.trunk ? CAM.rep.comp : 'sin evaluar'})` : '');
    }
    function camSetPick(w) { CAM.pick = w; camMsg(`Toca en la imagen el marcador de ${w === 'wrist' ? 'la muñeca' : 'el tronco'}.`); }
    function camPick(ev) {
      if (!CAM.pick || !CAM.last) return;
      const r = ev.currentTarget.getBoundingClientRect();
      const x = Math.round((1 - (ev.clientX - r.left) / r.width) * CAM.W), y = Math.round((ev.clientY - r.top) / r.height * CAM.H);
      let R = 0, G = 0, B = 0, n = 0;
      for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) {
        const px = x + i, py = y + j;
        if (px < 0 || py < 0 || px >= CAM.W || py >= CAM.H) continue;
        const k = (py * CAM.W + px) * 4; R += CAM.last.data[k]; G += CAM.last.data[k + 1]; B += CAM.last.data[k + 2]; n++;
      }
      const hv = n ? camHsv(R / n, G / n, B / n) : [0, 0, 0];
      if (hv[1] < 0.4 || hv[2] < 0.3) { camMsg('Color poco vivo: usa un marcador más saturado (verde, naranja, rosado) y buena luz.'); return; }
      CAM[CAM.pick] = { h: hv[0], tol: 18 };
      camMsg(`Marcador de ${CAM.pick === 'wrist' ? 'muñeca' : 'tronco'} guardado.`);
      CAM.pick = null;
    }
    function camSetRest() {
      if (!CAM.wp) { camMsg('Primero detecta el marcador de la muñeca (paso 1).'); return; }
      CAM.st = { rest: { x: CAM.wp.x, y: CAM.wp.y }, trest: CAM.tp ? { x: CAM.tp.x, y: CAM.tp.y } : null, up: false };
      CAM.rep = { n: 0, comp: 0, amps: [], ms: [], trunk: !!CAM.tp };
      CAM.counting = true;
      camMsg(CAM.tp ? 'Listo: cuenta repeticiones y compensación de tronco.' : 'Listo: cuenta repeticiones (sin marcador de tronco no se evalúa compensación).');
    }
    function camOnRep(ev) {
      const c = CAM.rep; c.n++; if (ev.comp) c.comp++; c.amps.push(ev.amp); c.ms.push(ev.ms);
      const eng = uiState.engine;
      if (eng && uiState.activeExerciseConfig && uiState.activeExerciseConfig.domain === 'motor') {
        eng.cam = c;
        if (CAM.auto) adjustMotorReps(ev.comp ? 'comp' : 'eff', 1);
      }
    }
    function camMetrics(eng) {
      const c = eng.cam; if (!c || !c.n) return {};
      const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
      return { camReps: c.n, camComp: c.trunk ? c.comp : null, camAmpPct: Math.round(avg(c.amps) * 100), camRepMs: Math.round(avg(c.ms)) };
    }
    function camText(eng) {
      const m = camMetrics(eng);
      return m.camReps ? ` · Cámara: ${m.camReps} rep, amplitud relativa ${m.camAmpPct}%, ${m.camComp == null ? 'tronco sin evaluar' : m.camComp + ' con compensación de tronco'}` : '';
    }
    function camStop() {
      if (CAM.timer) clearInterval(CAM.timer);
      if (CAM.stream) CAM.stream.getTracks().forEach(t => t.stop());
      CAM.timer = null; CAM.stream = null; CAM.video = null; CAM.counting = false;
    }
    function camClose() { camStop(); const p = document.getElementById('camPanel'); if (p) p.remove(); }

    function csvCell(v) {

    function csvText(kind) {
      const pat = getActivePatient();
      let head, rows;
      if (kind === 'eval') {
        const A = appState.assessments[pat.id] || {};
        head = ['paciente', 'hito', 'fecha', 'sesiones', ...EV_SCALES.map(s => s.k), 'observaciones'];
        rows = EV_MS.filter(m => A[m.k]).map(m => [pat.name, m.n, A[m.k].date, A[m.k].sessions, ...EV_SCALES.map(s => A[m.k].scores[s.k]), A[m.k].notes]);
      } else {
        const h = appState.sessionHistory.filter(x => x.patientId === pat.id).slice().reverse();
        const keys = [...new Set(h.flatMap(x => Object.keys(x.metrics || {})))].sort();
        head = ['paciente', 'fecha', 'hora', 'dominio', 'actividad', 'dificultad', 'fatiga', ...keys];
        rows = h.map(x => [pat.name, x.date, x.time, x.domain, x.activityTitle, x.difficulty || '', x.fatigue, ...keys.map(k => x.metrics ? x.metrics[k] : '')]);
      }
      return '\uFEFF' + [head, ...rows].map(r => r.map(csvCell).join(';')).join('\n');
    }
    // Separador ";" para que Excel en configuración regional chilena abra las columnas correctamente
    function exportCSV(kind) {
      try {

        a.download = `neurorehab_${kind === 'eval' ? 'evaluaciones' : 'historial'}_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        showToast('CSV generado.');
      } catch (e) { showToast('No se pudo exportar desde este visor. Abre el archivo HTML directamente en el navegador.'); }

    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playTone(type = 'success') {
      try { if (navigator.vibrate && appState.soundEnabled !== false) navigator.vibrate(type === 'error' ? [50, 40, 50] : 20); } catch (e) {}
      playTone0(type);
    }

    function playTone0(type = 'success') {
      if (!appState.soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.18);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'error') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(175, now + 0.25);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.31);
        } else if (type === 'rhythm') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(392, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.21);
        }
        osc.connect(gain);
        gain.connect(ctx.destination);
      } catch (e) {}
    }

    // =========================================================================
    // 7. ENGINE 1 LOGIC: ADAPTIVE GO / NO-GO + DUAL PROSPECTIVE TASK
    // =========================================================================
    function startGoNoGoSession() {
      const eng = uiState.engine;
      if (!eng) return;
      getAudioCtx();
      eng.phase = 'running';
      eng.trialIndex = 0;
      eng.hemiMode = hemiModeNow();
      eng.sideHist = [];
      eng.stats.side = { left: { tot: 0, hit: 0, rt: [] }, right: { tot: 0, hit: 0, rt: [] }, center: { tot: 0, hit: 0, rt: [] } };
      renderApp();
      scheduleNextGoNoGoTrial();
    }

    function scheduleNextGoNoGoTrial() {
      const eng = uiState.engine;
      if (!eng || eng.phase !== 'running') return;

      if (eng.trialIndex >= eng.totalTrials) {
        eng.phase = 'summary';
        eng.currentStimulus = null;
        playTone('success');
        renderApp();
        return;
      }

      eng.currentStimulus = null;
      eng.respondedThisTrial = false;
      updateGoNoGoStageDOM();

      // Inter-stimulus interval (ISI): 850ms - 1250ms
      const isiMs = 850 + Math.floor(Math.random() * 400);
      eng.isiTimer = setTimeout(() => {
        if (!uiState.engine || uiState.engine.phase !== 'running') return;
        eng.trialIndex++;

        // Choose stimulus type: ~60% Go, ~25% No-Go, ~15% Prospective (if dualTask active)
        const r = Math.random();
        let stim = 'go';
        if (eng.dualTask && r < 0.18) {
          stim = 'prospective';
          eng.stats.prospectiveTotal++;
        } else if (r < 0.45) {
          stim = 'nogo';
          eng.stats.nogoTotal++;
        } else {
          stim = 'go';
          eng.stats.goTotal++;
        }

        eng.currentStimulus = stim;
        eng.stimSide = nextHemiSide(eng);
        if (stim === 'go' || stim === 'prospective') eng.stats.side[eng.stimSide].tot++;
        eng.stimStartTime = performance.now();
        updateGoNoGoStageDOM();

        // Stimulus presentation window timeout
        eng.stimTimer = setTimeout(() => {
          handleGoNoGoTimeout();
        }, eng.currentWindowMs);
      }, isiMs);
    }

    function handleGoNoGoTimeout() {
      const eng = uiState.engine;
      if (!eng || eng.phase !== 'running' || eng.respondedThisTrial) return;
      eng.respondedThisTrial = true;

      if (eng.currentStimulus === 'nogo') {
        // Correct inhibition!
        eng.stats.nogoInhibited++;
        eng.consecutiveCorrect++;
        eng.feedbackText = '✓ ¡Excelente inhibición ante señal roja!';
        eng.feedbackType = 'good';
        applyAdaptiveStaircase(true);
      } else {
        // Omission error on Go or Prospective
        eng.consecutiveCorrect = 0;
        eng.feedbackText = '⏱ Tiempo agotado: intenta responder un poco más rápido.';
        eng.feedbackType = 'warn';
        playTone('error');
        applyAdaptiveStaircase(false);
      }
      scheduleNextGoNoGoTrial();
    }

    function handleGoNoGoTap(buttonType) {
      const eng = uiState.engine;
      if (!eng || eng.phase !== 'running') return;

      if (!eng.currentStimulus || eng.respondedThisTrial) {
        // Anticipatory tap during ISI
        eng.consecutiveCorrect = 0;
        eng.feedbackText = '⚠ Espera a que aparezca la señal antes de pulsar.';
        eng.feedbackType = 'warn';
        playTone('error');
        updateGoNoGoStageDOM();
        return;
      }

      clearTimeout(eng.stimTimer);
      eng.respondedThisTrial = true;
      const rt = Math.round(performance.now() - eng.stimStartTime);

      if (buttonType === 'go' && eng.currentStimulus === 'go') {
        eng.stats.goHits++;
        eng.stats.reactionTimes.push(rt);
        { const sd = eng.stats.side[eng.stimSide || 'center']; sd.hit++; sd.rt.push(rt); }
        eng.consecutiveCorrect++;
        eng.feedbackText = `✓ ¡Acierto! Tiempo de reacción: ${rt} ms`;
        eng.feedbackType = 'good';
        playTone('success');
        applyAdaptiveStaircase(true);
      } else if (buttonType === 'prospective' && eng.currentStimulus === 'prospective') {
        eng.stats.prospectiveHits++;
        eng.stats.reactionTimes.push(rt);
        { const sd = eng.stats.side[eng.stimSide || 'center']; sd.hit++; sd.rt.push(rt); }
        eng.consecutiveCorrect++;
        eng.feedbackText = `✓ ¡Recordatorio de Medicación activado! (${rt} ms)`;
        eng.feedbackType = 'good';
        playTone('success');
        applyAdaptiveStaircase(true);
      } else {
        // Commission error (tapped on No-Go or wrong button on Prospective)
        eng.consecutiveCorrect = 0;
        eng.feedbackText = eng.currentStimulus === 'nogo'
          ? '✕ Error de comisión: ante la señal ROJA debes frenar.'
          : '✕ Recordatorio: ante el Medicamento pulsa el botón ámbar.';
        eng.feedbackType = 'bad';
        playTone('error');
        applyAdaptiveStaircase(false);
      }

      scheduleNextGoNoGoTrial();
    }

    function applyAdaptiveStaircase(wasCorrect) {
      const eng = uiState.engine;
      if (!eng) return;
      if (wasCorrect) {
        if (eng.consecutiveCorrect > 0 && eng.consecutiveCorrect % 3 === 0) {
          eng.currentWindowMs = Math.max(eng.minWindowMs, eng.currentWindowMs - 120);
          eng.minWindowReached = Math.min(eng.minWindowReached, eng.currentWindowMs);
          eng.feedbackText += ` · ⚡ Velocidad aumentada (${eng.currentWindowMs} ms)`;
        }
      } else {
        eng.currentWindowMs = Math.min(eng.maxWindowMs, eng.currentWindowMs + 180);
      }
    }

    // =========================================================================
    // 9. ENGINE 3 LOGIC: ADL / IADL SEQUENCING + EXECUTIVE UNEXPECTED EVENT
    // =========================================================================
    function placeAdlStepInNextSlot(stepId) {
      const eng = uiState.engine;
      if (!eng || eng.phase !== 'sequencing') return;
      const emptyIdx = eng.slots.findIndex(s => s === null);
      if (emptyIdx === -1) return;
      const poolIdx = eng.pool.findIndex(p => p.id === stepId);
      if (poolIdx === -1) return;
      const [item] = eng.pool.splice(poolIdx, 1);
      eng.slots[emptyIdx] = item;
      eng.scaffoldingHint = '';
      playTone('success');
      renderApp();
    }

    function removeAdlStepFromSlot(slotIdx) {
      const eng = uiState.engine;
      if (!eng || eng.phase !== 'sequencing') return;
      const item = eng.slots[slotIdx];
      if (!item) return;
      eng.slots[slotIdx] = null;
      eng.pool.push(item);
      eng.scaffoldingHint = '';
      renderApp();
    }

    function verifyAdlSequence() {
      const eng = uiState.engine;
      if (!eng) return;
      if (eng.slots.some(s => s === null)) {
        showToast('Completa todos los pasos numerados antes de verificar.');
        return;
      }
      const correctOrder = eng.scenario.steps;
      let firstErrorIdx = -1;
      for (let i = 0; i < correctOrder.length; i++) {
        if (eng.slots[i].id !== correctOrder[i].id) {
          firstErrorIdx = i;
          break;
        }
      }

      if (firstErrorIdx === -1) {
        playTone('success');
        eng.phase = 'unexpected';
        renderApp();
      } else {
        eng.hintCount++;
        playTone('error');
        eng.scaffoldingHint = `Andamiaje Adaptativo: Revisa el Paso ${firstErrorIdx + 1}. Para avanzar con seguridad, primero conviene: «${correctOrder[firstErrorIdx].text}». Toca el paso incorrecto para devolverlo y reordenar.`;
        renderApp();
      }
    }

    function answerAdlUnexpected(optIdx) {
      const eng = uiState.engine;
      if (!eng || eng.phase !== 'unexpected') return;
      eng.unexpectedChoiceIdx = optIdx;
      const opt = eng.scenario.unexpectedEvent.options[optIdx];
      if (opt.correct) {
        eng.unexpectedSolved = true;
        playTone('success');
      } else {
        eng.hintCount++;
        playTone('error');
      }
      renderApp();
    }

    // =========================================================================
    function selectMotorExerciseInEngine(exId) {
      const eng = uiState.engine;
      if (!eng) return;

      if (!ex) return;

    }

    function setMotorTimerPreset(sec) {
      const eng = uiState.engine;
      if (!eng) return;
      if (eng.motorTimerInterval) clearInterval(eng.motorTimerInterval);
      eng.running = false;
      if (sec === 0) {
        eng.timerMode = 'stopwatch';
        eng.presetSec = 0;
        eng.remainingSec = 0;
        eng.elapsedSec = 0;
      } else {
        eng.timerMode = 'countdown';
        eng.presetSec = sec;
        eng.remainingSec = sec;
        eng.elapsedSec = 0;
      }
      renderApp();
    }

    function startMotorRest60() {
      const eng = uiState.engine;
      if (!eng) return;
      if (eng.motorTimerInterval) clearInterval(eng.motorTimerInterval);
      eng.timerMode = 'rest';
      eng.presetSec = 60;
      eng.remainingSec = 60;
      eng.elapsedSec = 0;
      eng.running = false;
      toggleMotorTimer();
    }

    function toggleMotorTimer() {
      const eng = uiState.engine;
      if (!eng) return;
      if (eng.running) {
        clearInterval(eng.motorTimerInterval);
        eng.running = false;
        renderApp();
        return;
      }
      getAudioCtx();
      if (eng.timerMode !== 'stopwatch' && eng.remainingSec <= 0) {
        eng.remainingSec = eng.presetSec || 60;
        eng.elapsedSec = 0;
      }
      eng.running = true;
      eng.motorTimerInterval = setInterval(() => {
        if (!uiState.engine || !uiState.engine.running) return;
        if (eng.timerMode === 'stopwatch') {
          eng.elapsedSec++;
        } else {
          eng.remainingSec--;
          eng.elapsedSec++;
          if (eng.remainingSec <= 0) {
            eng.remainingSec = 0;
            clearInterval(eng.motorTimerInterval);
            eng.running = false;
            playTone('success');
            if (eng.timerMode === 'rest') {
              const ex = MOTOR_EXERCISES.find(m => m.id === eng.selectedMotorId) || MOTOR_EXERCISES[0];
              eng.timerMode = 'countdown';
              eng.presetSec = ex.suggestedSec;
              eng.remainingSec = ex.suggestedSec;
              eng.elapsedSec = 0;
              showToast('Descanso de 60s finalizado.');
            } else {
              showToast('¡Bloque motor completado!');
            }
            renderApp();
            return;
          }
        }
        const dEl = document.getElementById('motorClockDigits');
        if (dEl) {
          const val = eng.timerMode === 'stopwatch' ? eng.elapsedSec : eng.remainingSec;
          dEl.textContent = formatSecMMSS(val);
        }
      }, 1000);
      renderApp();
    }

    function toggleMotorRhythm3s() {
      const eng = uiState.engine;
      if (!eng) return;
      eng.rhythmActive = !eng.rhythmActive;
      if (eng.rhythmInterval) {
        clearInterval(eng.rhythmInterval);
        eng.rhythmInterval = null;
      }
      if (eng.rhythmActive) {
        getAudioCtx();
        const pulseFn = () => {
          playTone('rhythm');
          const orb = document.getElementById('motorRhythmOrb');
          if (orb) {
            orb.classList.add('pulse');
            setTimeout(() => orb.classList.remove('pulse'), 550);
          }
        };
        pulseFn();
        eng.rhythmInterval = setInterval(pulseFn, 3000);
      }
      renderApp();
    }

    function adjustMotorReps(type, delta) {
      const eng = uiState.engine;
      if (!eng) return;
      if (type === 'eff') {
        eng.effectiveReps = Math.max(0, eng.effectiveReps + delta);
        if (delta > 0) playTone('success');
      } else {
        eng.compensatedReps = Math.max(0, eng.compensatedReps + delta);
      }
      renderApp();
    }

    // Spacebar shortcut for Motor Effective Reps when inside Motor Engine
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && appState.userTab === 'active_exercise' && uiState.activeExerciseConfig?.domain === 'motor') {
        const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
        if (['input', 'textarea', 'select', 'button'].includes(tag)) return;
        e.preventDefault();
        adjustMotorReps('eff', 1);
      }
    });

    function formatSecMMSS(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // =========================================================================
    // 12. COMPLETE & SAVE EXERCISE RESULT TO CLINICAL EVOLUTION & USER PLAN
    // =========================================================================
    function finishAndSaveActiveExercise() {
      const cfg = uiState.activeExerciseConfig;
      const eng = uiState.engine;
      const pat = getActivePatient();
      if (!cfg || !eng || !pat) return;

      let summaryText = '';
      let metrics = {};

      if (cfg.domain === 'inhibitory') {
        const s = eng.stats;
        const meanRt = s.reactionTimes.length > 0
          ? Math.round(s.reactionTimes.reduce((a, b) => a + b, 0) / s.reactionTimes.length)
          : 0;
        const goAcc = s.goTotal > 0 ? Math.round((s.goHits / s.goTotal) * 100) : 100;
        const nogoAcc = s.nogoTotal > 0 ? Math.round((s.nogoInhibited / s.nogoTotal) * 100) : 100;
        summaryText = `TR medio: ${meanRt} ms · Go: ${goAcc}% · No-Go: ${nogoAcc}% · Ventana final: ${eng.currentWindowMs} ms`;
        metrics = { meanRtMs: meanRt, goAccPct: goAcc, nogoAccPct: nogoAcc, adaptiveEndMs: eng.currentWindowMs, ...hemiMetrics(eng) };
        summaryText += hemiText(eng);
      } else if (cfg.domain === 'memory') {
        const truePos = eng.targetItems.filter(t => eng.selectedIds.includes(t.id)).length;
        const falsePos = eng.selectedIds.filter(id => !eng.targetItems.some(t => t.id === id)).length;
        const recallPct = Math.max(0, Math.round(((truePos - falsePos * 0.5) / eng.targetItems.length) * 100));
        summaryText = `Recuerdo episódico: ${truePos}/${eng.targetItems.length} (${recallPct}%) · Memoria prospectiva: ${eng.prospectiveConfirmed ? 'Cumplida' : 'Omitida'}`;
        metrics = { recallPct, truePos, totalTargets: eng.targetItems.length, prospectiveOk: eng.prospectiveConfirmed };
      } else if (cfg.domain === 'adl') {
        const autonomyPct = Math.max(40, 100 - eng.hintCount * 15);
        summaryText = `Secuencia AVD completada (${autonomyPct}% autonomía) · Imprevisto ejecutivo: ${eng.unexpectedSolved ? 'Resuelto' : 'Con apoyo'} · Andamiajes: ${eng.hintCount}`;
        metrics = { adlAutonomyPct: autonomyPct, unexpectedSolved: eng.unexpectedSolved, hintsUsed: eng.hintCount };
      } else if (cfg.domain === 'language') {
        if (eng.subMode === 'naming') {
          const maxPts = Math.max(1, eng.namingScores.length * 3);
          const gotPts = eng.namingScores.reduce((a, b) => a + b.score, 0);
          const pct = Math.round((gotPts / maxPts) * 100);
          const autoCount = eng.namingScores.filter(n => n.score === 3).length;
          const cuedCount = eng.namingScores.filter(n => n.score > 0 && n.score < 3).length;
          summaryText = `Denominación: ${pct}% (${autoCount} autónomas, ${cuedCount} con claves)`;
          metrics = { namingScorePct: pct, autonomousNamingCount: autoCount, cuedNamingCount: cuedCount };
        } else if (eng.subMode === 'sfa') {
          summaryText = `Análisis de Rasgos Semánticos (ARS) completado (${eng.exploredSfaKeys.length}/6 atributos explorados)`;
          metrics = { namingScorePct: 85, sfaFeatures: eng.exploredSfaKeys.length };
        } else {
          const pragPct = Math.round((eng.pragmaticCorrectCount / PRAGMATIC_ITEMS.length) * 100);
          summaryText = `Comprensión Pragmática y Lenguaje Figurado: ${eng.pragmaticCorrectCount}/${PRAGMATIC_ITEMS.length} (${pragPct}%)`;
          metrics = { namingScorePct: pragPct, pragmaticPct: pragPct };
        }
      } else if (cfg.domain === 'motor') {
        const total = eng.effectiveReps + eng.compensatedReps;
        const qualPct = total > 0 ? Math.round((eng.effectiveReps / total) * 100) : 0;
        const ex = MOTOR_EXERCISES.find(m => m.id === eng.selectedMotorId) || MOTOR_EXERCISES[0];
        summaryText = `${ex.code} ${ex.title}: ${eng.effectiveReps} rep. efectivas / ${eng.compensatedReps} comp. (${qualPct}% calidad) · EVA: ${eng.painEva}/10`;
        metrics = {
          effectiveReps: eng.effectiveReps,
          compensatedReps: eng.compensatedReps,
          motorQualityPct: qualPct,
          painEva: eng.painEva
        };
      }

      if (cfg.domain === 'motor') { Object.assign(metrics, camMetrics(eng)); summaryText += camText(eng); }

      // Mark plan item completed if launched from Mi Plan
      if (cfg.planItemId) {
        const plan = getActivePatientPlan();
        const pItem = plan.find(i => i.id === cfg.planItemId);
        if (pItem) pItem.completedToday = true;
      }

      const now = new Date();
      appState.sessionHistory.unshift({
        id: 'HIST-' + Date.now(),
        patientId: pat.id,
        date: now.toISOString().slice(0, 10),
        time: now.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }),
        domain: cfg.domain,
        activityTitle: cfg.title,
        difficulty: cfg.difficulty || '',
        summaryText,
        metrics
      });

      cleanupActiveTimers();
      uiState.activeExerciseConfig = null;
      uiState.engine = null;
      appState.userTab = 'plan';
      persistState();
      playTone('success');
      const entryId = appState.sessionHistory[0].id;
      const warnPain = (metrics.painEva || 0) >= 4 ? ' · ⚠ Dolor EVA ≥ 4: avisar al terapeuta' : '';
      const warnTime = Math.round((Date.now() - SESSION_T0) / 60000) >= 45 ? ' · ⏱ Más de 45 min de uso: se sugiere pausa' : '';
      showToast('✓ ¡Actividad guardada en tu evolución!' + warnPain + warnTime);
      setTimeout(() => askFatigue(entryId), 700);
      renderApp();
    }

    function selectActivePatient(patId) {

    function savePatientProfile(e) {
      e.preventDefault();
      const name = document.getElementById('patName').value.trim();
      const age = Number(document.getElementById('patAge').value) || 60;
      const diagnosis = document.getElementById('patDiag').value.trim();
      const affectedSide = document.getElementById('patSide').value;
      const motorLevel = document.getElementById('patMotor').value;
      const themeColor = document.getElementById('patThemeColor')?.value || 'petrol';
      const cognitiveProfile = document.getElementById('patCog').value.trim();
      const clinicalNotes = document.getElementById('patNotes').value.trim();

      if (!name || !diagnosis) {
        showToast('Ingresa el nombre y diagnóstico del paciente.');
        return;
      }

      if (uiState.editingPatientId) {
        const idx = appState.patients.findIndex(p => p.id === uiState.editingPatientId);
        if (idx >= 0) {
          appState.patients[idx] = {
            ...appState.patients[idx],
            name, age, diagnosis, affectedSide, motorLevel, themeColor, cognitiveProfile, clinicalNotes
          };
        }
        uiState.editingPatientId = null;
        showToast('Perfil clínico actualizado.');
      } else {
        const newId = 'pat-' + Date.now();
        appState.patients.push({
          id: newId,
          name, age, diagnosis, affectedSide, motorLevel, themeColor, cognitiveProfile, clinicalNotes
        });
        appState.activePatientId = newId;
        appState.sessionPlans[newId] = [];
        appState.appMode = 'clinical'; appState.clinicalTab = 'evaluation'; uiState.evalMs = 'basal';
        showToast(`Paciente ${name} creado. Completa su evaluación basal.`);
      }

      persistState();
      renderApp();
    }

    function deletePatientProfile(patId) {
      if (appState.patients.length <= 1) {
        showToast('Debe existir al menos un perfil de paciente activo.');
        return;
      }
      appState.patients = appState.patients.filter(p => p.id !== patId);
      delete appState.sessionPlans[patId];
      if (appState.activePatientId === patId) {
        appState.activePatientId = appState.patients[0].id;
      }
      uiState.confirmDeletePatientId = null;
      persistState();
      showToast('Perfil eliminado.');
      renderApp();
    }

      const trialsOrSec = Math.max(1, Number(document.getElementById('planParamVal').value) || 15);
      const initialSpeedMs = Number(document.getElementById('planSpeedMs')?.value) || 1600;

      const subMode = document.getElementById('planLangSubMode')?.value || 'naming';

    function generateClinicalEvolutionReportText(pat, patHistory) {
      const today = new Date().toISOString().slice(0, 10);
      const inh = patHistory.filter(h => h.domain === 'inhibitory');
      const mem = patHistory.filter(h => h.domain === 'memory');
      const adl = patHistory.filter(h => h.domain === 'adl');
      const lan = patHistory.filter(h => h.domain === 'language');
      const mot = patHistory.filter(h => h.domain === 'motor');

      const avgRt = inh.length
        ? Math.round(inh.reduce((a, b) => a + (b.metrics.meanRtMs || 0), 0) / inh.length) + ' ms'
        : 'Sin registro';
      const avgNogo = inh.length
        ? Math.round(inh.reduce((a, b) => a + (b.metrics.nogoAccPct || 0), 0) / inh.length) + '%'
        : 'Sin registro';
      const avgMem = mem.length
        ? Math.round(mem.reduce((a, b) => a + (b.metrics.recallPct || 0), 0) / mem.length) + '%'
        : 'Sin registro';
      const avgAdl = adl.length
        ? Math.round(adl.reduce((a, b) => a + (b.metrics.adlAutonomyPct || 0), 0) / adl.length) + '%'
        : 'Sin registro';
      const avgLan = lan.length
        ? Math.round(lan.reduce((a, b) => a + (b.metrics.namingScorePct || 0), 0) / lan.length) + '%'
        : 'Sin registro';
      const totalEffReps = mot.reduce((a, b) => a + (b.metrics.effectiveReps || 0), 0);
      const totalCompReps = mot.reduce((a, b) => a + (b.metrics.compensatedReps || 0), 0);
      const motQual = (totalEffReps + totalCompReps) > 0
        ? Math.round((totalEffReps / (totalEffReps + totalCompReps)) * 100) + '%'
        : 'Sin registro';
      const maxPain = mot.length ? Math.max(...mot.map(m => m.metrics.painEva || 0)) + '/10' : '0/10';

      const lines = patHistory.length === 0
        ? '  - Sin actividades registradas aún para este perfil.'
        : patHistory.slice(0, 12).map((h, i) =>
            `  ${i + 1}. [${h.date} ${h.time}] ${DOMAIN_META[h.domain]?.name || h.domain} — ${h.activityTitle}\n     Resultado: ${h.summaryText}`
          ).join('\n');

      return [
        '========================================================================',
        'INFORME DE EVOLUCIÓN CLÍNICA — NEUROREHAB APP (TERAPIA OCUPACIONAL)',
        '========================================================================',
        `Fecha de Emisión: ${today} | Profesional: ${appState.therapistName}`,
        `Paciente: ${pat.name} (${pat.age} años) | Hemicuerpo Afectado: ${pat.affectedSide}`,
        `Diagnóstico / Etiología: ${pat.diagnosis}`,
        `Nivel Motor Basal: ${pat.motorLevel} | Perfil Cognitivo: ${pat.cognitiveProfile}`,
        '',
        '1. INDICADORES OBJETIVOS POR DOMINIO TERAPÉUTICO:',
        `   • Control Inhibitorio (Go/No-Go): TR Medio = ${avgRt} | Inhibición No-Go = ${avgNogo}`,
        `   • Memoria Episódica y Prospectiva: Tasa de Recuerdo = ${avgMem}`,
        `   • Planificación en AVD / AIVD: Autonomía Ejecutiva = ${avgAdl}`,
        `   • Lenguaje y Comunicación: Rendimiento Denominación/Pragmática = ${avgLan}`,
        `   • Movilidad Extremidad Superior: ${totalEffReps} rep. efectivas / ${totalCompReps} compensadas (Calidad: ${motQual} | EVA Máx: ${maxPain})`,
        '',
        '2. REGISTRO CRONOLÓGICO DE ACTIVIDADES EJECUTADAS:',
        lines,
        '',
        '3. OBSERVACIONES Y PROGRESIÓN TERAPÉUTICA:',
        `   ${pat.clinicalNotes || 'Continuar plan individualizado con monitoreo de fatiga y transferencia funcional a AVD.'}`,
        '========================================================================'
      ].join('\n');
    }

    function importClinicalJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && Array.isArray(parsed.patients) && parsed.patients.length > 0) {
            appState = parsed;
            persistState();
            renderApp();
            showToast('Datos clínicos importados correctamente.');
          } else {
            showToast('Archivo JSON inválido.');
          }
        } catch (err) {
          showToast('Error al leer archivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    // =========================================================================
    // 14. RENDER FUNCTIONS: APP SHELL + USER VIEWS + CLINICAL VIEWS
    // =========================================================================
    function renderApp() {
      const pat = getActivePatient();

      // Update Header
      const logoEl = document.getElementById('appLogoContainer');
      if (logoEl && !logoEl.innerHTML) logoEl.innerHTML = SVG_LIBRARY.logo;

      const patNameEl = document.getElementById('headerPatientName');
      if (patNameEl && pat) {
        const th = getPatientTheme(pat);
        patNameEl.textContent = `${pat.name} · Hemi. ${pat.affectedSide} (${pat.motorLevel})`;
        const dotEl = document.querySelector('#headerPatientBadge .patient-dot');
        if (dotEl) {
          dotEl.style.background = th.soft;
          dotEl.style.border = '2px solid #FFFFFF';
          dotEl.style.width = '10px';
          dotEl.style.height = '10px';
        }
      }

      const btnUser = document.getElementById('btnModeUser');
      const btnClin = document.getElementById('btnModeClinical');
      if (btnUser && btnClin) {
        btnUser.className = `mode-switch-btn ${appState.appMode === 'user' ? 'active-user' : ''}`;
        btnClin.className = `mode-switch-btn ${appState.appMode === 'clinical' ? 'active-clinical' : ''}`;
      }

      applyPatientTheme(pat);
      applyAdaptations(pat);
      // Render Dynamic Bottom Navigation Bar
      renderBottomNav();

      // Render Active Viewport
      const vp = document.getElementById('mainViewport');
      if (!vp) return;

      if (appState.appMode === 'user') {
        if (appState.userTab === 'active_exercise' && uiState.activeExerciseConfig) {
          vp.innerHTML = renderActiveExerciseView();
          if (uiState.activeExerciseConfig.domain === 'inhibitory' && uiState.engine?.phase === 'running') {
            updateGoNoGoStageDOM();
          }
        } else if (appState.userTab === 'modules') {
          vp.innerHTML = renderUserModulesView();
        } else if (appState.userTab === 'achievements') {
          vp.innerHTML = renderUserAchievementsView();
        } else {
          vp.innerHTML = renderUserPlanView();
        }
      } else {
        if (appState.clinicalTab === 'evaluation') {
          vp.innerHTML = renderEvaluationView();
        } else if (appState.clinicalTab === 'planner') {
          vp.innerHTML = renderClinicalPlannerView();
        } else if (appState.clinicalTab === 'evolution') {
          vp.innerHTML = renderClinicalEvolutionView();
        } else {
          vp.innerHTML = renderClinicalPatientsView();
        }
      }
    }

    function renderBottomNav() {
      renderBottomNav0();
      if (appState.appMode === 'clinical') {
        const nav = document.getElementById('bottomNavInner');
        if (nav) nav.insertAdjacentHTML('beforeend', EVAL_TAB_HTML());
      }
    }

    function renderBottomNav0() {
      const nav = document.getElementById('bottomNavInner');

        const plan = getActivePatientPlan();

        nav.innerHTML = `

            <span style="font-size:1.25rem;">🧩</span>
            <span>Módulos</span>
          </button>
          <button type="button" class="nav-tab-btn ${appState.userTab === 'achievements' ? 'active-user-tab' : ''}" onclick="switchUserTab('achievements')">

            <span style="font-size:1.25rem;">👥</span>
            <span>Pacientes (${appState.patients.length})</span>
          </button>

            <span style="font-size:1.25rem;">🗓️</span>
            <span>Planificador</span>
          </button>
          <button type="button" class="nav-tab-btn ${appState.clinicalTab === 'evolution' ? 'active-clinical-tab' : ''}" onclick="switchClinicalTab('evolution')">
            <span style="font-size:1.25rem;">📊</span>
            <span>Evolución (${histCount})</span>
          </button>

    // -------------------------------------------------------------------------
    // USER MODE VIEW 1: MI PLAN (ASSIGNED SESSION)
    // -------------------------------------------------------------------------
    function renderUserPlanView() {
      const pat = getActivePatient();
      const plan = getActivePatientPlan();

      const pct = plan.length > 0 ? Math.round((completedCount / plan.length) * 100) : 0;

              <p style="margin:0;font-size:0.9rem;color:#E2F1F4;">

            <div style="background:rgba(255,255,255,0.14);padding:0.6rem 0.9rem;border-radius:14px;text-align:center;">

            <button type="button" class="btn btn-sage" onclick="switchUserTab('modules')">Explorar Módulos Libres</button>
          </section>
        ` : `
          <div>
            ${plan.map((item, idx) => {
              const dMeta = DOMAIN_META[item.domain] || DOMAIN_META.inhibitory;
              const configPayload = JSON.stringify({
                domain: item.domain,
                planItemId: item.id,
                title: item.title,
                difficulty: item.difficulty,
                trialsOrSec: item.trialsOrSec,
                initialSpeedMs: item.initialSpeedMs || 1600,
                dualTask: Boolean(item.dualTask),
                scenarioId: item.scenarioId || '',
                subMode: item.subMode || 'naming',
                motorExId: item.motorExId || '',
                notes: item.notes || ''
              }).replace(/"/g, '&quot;');

              return `
                <article class="plan-task-card ${item.completedToday ? 'completed' : ''}">
                  <div style="display:flex;align-items:flex-start;gap:0.85rem;">
                    <div class="svg-icon-box">${SVG_LIBRARY[dMeta.icon]}</div>
                    <div style="flex:1;min-width:0;">
                      <div style="display:flex;flex-wrap:wrap;gap:0.4rem;align-items:center;margin-bottom:0.25rem;">
                        <span class="badge ${item.completedToday ? 'badge-sage' : 'badge-petrol'}">
                          ${item.completedToday ? '✓ Completada' : `Actividad ${idx + 1}`}
                        </span>
                        <span class="badge badge-amber">${dMeta.shortName} · Nivel ${item.difficulty}</span>
                      </div>
                      <h3 style="margin:0.15rem 0 0.3rem 0;font-size:1.1rem;font-weight:800;color:var(--petrol-dark);">${item.title}</h3>
                      ${item.notes ? `<p style="margin:0;font-size:0.86rem;color:var(--text-secondary);">💡 <b>Indicación:</b> ${item.notes}</p>` : ''}
                    </div>
                  </div>
                  <button type="button" class="btn ${item.completedToday ? 'btn-outline' : 'btn-sage'} btn-block"

                    ${item.completedToday ? '↻ Practicar Nuevamente' : '▶ Comenzar Actividad'}

        <section class="hero-welcome" style="background:linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 100%);">

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-top:1rem;">
